  src:"Resumen · 6. Autoridades de certificación" },
{ b:"seg", q:"El protocolo que permite autenticar clientes remotos, que se negocia durante el proceso de establecimiento de conexión e implementa el envío de desafíos en forma periódica es:",
  o:["CHAP","IDEA","RSA","DES","TCP","PAP"], c:[0],
  why:"CHAP autentica con desafío–respuesta (hash, sin mandar la contraseña) y repite los desafíos periódicamente. PAP manda usuario y clave en texto plano una sola vez.",
  src:"Resumen · 6. Autenticación" },
{ b:"seg", q:"¿En qué capa se pueden manejar la autenticación y el no repudio?",
  o:["Ninguna de las opciones.","Transporte.","Aplicación.","Red."], c:[2],
  why:"Las capas inferiores pueden cifrar, pero autenticar usuarios y asegurar el no repudio requiere conocer al usuario y su mensaje, y eso solo se puede en la capa de aplicación.",
  src:"Tanenbaum 8.1 · Seguridad por capas" },
{ b:"seg", q:"Cuál de las siguientes define “combinación de software y hardware que separa la red de una organización de Internet, permitiendo que pasen algunos paquetes y bloqueando otros”:",
  o:["Firewall","Firma digital","Servidor de correo electrónico","Autoridad de certificación","Servidor DNS","Router","DMZ"], c:[0],
  why:"Es la definición de firewall: aísla la red interna de Internet y filtra el tráfico según las reglas de la política de seguridad.",
  src:"Resumen · 6. Firewall" },
{ b:"seg", q:"¿Cómo se realiza el filtrado de paquetes tradicional en los firewall?",
  o:["Se agrupan varios datagramas y se procede a su revisión","Examinando cada datagrama individualmente.","Se examinan aleatoriamente los datagramas.","Se toma todo el archivo, que entra o sale de la red y luego se examina.","Ninguna de las opciones."], c:[1],
  why:"El filtro tradicional (sin estado) analiza cada paquete de manera independiente, mirando IP, puertos, tipo ICMP y bits SYN/ACK.",
  src:"Resumen · 6. Filtrado de paquetes" },
{ b:"seg", q:"¿En qué se basan las decisiones de firewall con estado?",
  o:["Mantiene un registro de las conexiones a través de los campos del encabezado TCP/IP.","Analizan los datagramas que circulan en la red local.","Ninguna de las opciones.","Tiene una tabla de todas las conexiones de internet para asegurar la LAN.","Deja pasar todas las conexiones de la LAN hacia el exterior, porque son confiables."], c:[0],
  why:"El firewall con estado lleva una tabla de las conexiones TCP activas (a partir de los campos TCP/IP). Un paquete entrante solo pasa si pertenece a una conexión ya establecida.",
  src:"Resumen · 6. Filtros con estado" },
{ b:"seg", q:"Si se configura en un firewall que los paquetes provenientes de determinada red NO pueden atravesar el router, se están implementando:",
  o:["Políticas restrictivas","Hash criptográficos","Firmas digitales","Autoridades de certificación","Políticas permisivas","Autenticación"], c:[4],
  why:"Política permisiva: pasa todo salvo lo explícitamente prohibido. Acá solo se prohíbe una red puntual y el resto pasa. Una restrictiva niega todo salvo lo permitido.",
  src:"Resumen · 6. Filtrado de paquetes" },
{ b:"seg", q:"¿Cuál de las siguientes opciones cumple con los firewall que usan pasarelas de aplicación?",
  o:["Solo filtran puertos de TCP o UDP.","Utilizan tablas dinámicas para seguir el estado en tiempo real de las sesiones end-to-end.","Ninguna de las opciones.","Tipo de mensaje ICMP.","Permite filtrar según perfiles de usuarios."], c:[4],
  why:"La pasarela de aplicación mira el contenido de la capa de aplicación, así que puede filtrar por usuario (por ejemplo, quién puede usar Telnet hacia afuera). Las tablas de estado son del firewall con estado.",
  src:"Resumen · 6. Pasarelas de aplicación" },
{ b:"seg", q:"¿Qué inconveniente tiene un administrador de seguridad al aplicar firewall que usan pasarelas de aplicación?",
  o:["Es muy engorroso el control por usuarios.","Se requiere una pasarela de aplicación para cada aplicación.","Los usuarios móviles de la empresa son el mayor inconveniente para el administrador.","Se necesita un servidor independiente para cada pasarela de aplicación.","Ninguna de las opciones."], c:[1],
  why:"Como la pasarela entiende un protocolo de aplicación concreto, hace falta una por cada aplicación (HTTP, FTP, Telnet…).",
  src:"Resumen · 6. Pasarelas de aplicación" },
{ b:"seg", q:"¿Para qué sirve la DMZ?",
  o:["Para tener más control de las computadoras de la red local.","Es la parte de la red de la empresa que se encuentra fuera del perímetro de seguridad.","Ninguna de las opciones.","Es parte de la red de la empresa, donde se guardan los backup por seguridad."], c:[1],
  why:"La DMZ (zona desmilitarizada) es la parte de la red fuera del perímetro de seguridad interno, donde se ubican los servidores accesibles desde Internet (web, correo).",
  src:"Resumen · 6. DMZ" },
{ b:"seg", q:"Una empresa desea ubicar servidores que sean accesibles desde Internet, pero desea proteger su red interna de posibles amenazas, para ello deberá configurar:",
  o:["DMZ.","SHA-1/SHA-2.","Hash criptográfico.","Un switch.","MD5.","Servidor DNS."], c:[0],
  why:"Se ponen los servidores públicos en una DMZ, separada de la LAN por el firewall. Si atacan un servidor, la red interna sigue protegida.",
  src:"Resumen · 6. DMZ" },
{ b:"seg", q:"Una empresa desea ubicar servidores que sean accesibles desde Internet, pero desea proteger su red interna de posibles amenazas, para ello deberá configurar (seleccione dos opciones):",
  o:["Servidor de archivos","Un switch","Hash criptográficos","NAT estática","SHA-1/SHA-2","MD5","Firmas digitales","DMZ"], c:[3,7],
  why:"La DMZ aísla los servidores públicos de la LAN, y la NAT estática les da una IP pública fija para que desde Internet se puedan iniciar conexiones hacia ellos.",
  src:"Resumen · 6. DMZ / 3. NAT estática" },
{ b:"seg", q:"Una empresa, debido a la pandemia, desea que sus empleados accedan a todos los servidores y bases de datos, pero desde sus hogares. Para ello, el administrador de red deberá configurar:",
  o:["Firmas digitales","VPN punto a punto","WiFi","Servidor de correo electrónico","VPN de acceso","DMZ"], c:[4],
  why:"La VPN de acceso remoto conecta usuarios individuales (home office) a la red de la empresa. La punto a punto (sitio a sitio) une oficinas o sucursales.",
  src:"Resumen · 6. VPN" },
{ b:"seg", q:"¿Qué tipo de VPN se utiliza para realizar home office?",
  o:["Acceso remoto.","Cliente servidor.","Peer to peer.","Punto a punto.","Ninguna de las opciones."], c:[0],
  why:"Para home office se usa una VPN de acceso remoto: cada empleado se conecta individualmente desde su casa a la red de la empresa. La punto a punto (sitio a sitio) une oficinas o sucursales completas.",
  src:"Resumen · 6. VPN" },
{ b:"seg", q:"¿Cómo se configuran las VPN punto a punto?",
  o:["Ninguna de las opciones.","Estáticas.","Depende del ISP.","Dinámicas.","Depende del tráfico de la red."], c:[1],
  why:"Las VPN punto a punto (sitio a sitio) son estáticas: el túnel entre los gateways de cada sede está siempre configurado. Las de acceso remoto son dinámicas, se levantan cuando el usuario se conecta.",
  src:"Resumen · 6. VPN" },
{ b:"seg", q:"Cuáles de las siguientes son características de las redes privadas virtuales, seleccione dos opciones:",
  o:["Requiere que los empleados se registren en un servidor DNS","Requiere que la empresa contrate líneas dedicadas","Permiten que las empresas conecten sus oficinas y sucursales a un costo reducido","La información que viaja por Internet queda expuesta a ataques pasivos y activos","Permiten que los empleados se conecten de manera remota a los recursos de la organización","Requiere que se configuren DMZ"], c:[2,4],
  why:"La VPN usa túneles cifrados sobre Internet: une sucursales sin pagar líneas dedicadas (costo reducido) y permite el acceso remoto de empleados. Al ir cifrada, la información no queda expuesta.",
  src:"Resumen · 6. VPN" },
{ b:"seg", q:"¿Cuál de las siguientes opciones corresponde a servicios principales que brinda IPsec?",
  o:["Integridad de datos.","Ninguna de las opciones.","Es no orientado a la conexión.","No funciona sobre todos los protocolos de capa 2.","Trabaja tanto para TCP como UDP."], c:[0],
  why:"Los servicios de IPsec son confidencialidad, integridad de datos, autenticación y protección contra repetición. Que funcione con TCP y UDP es una consecuencia de estar en capa de red, no un servicio.",
  src:"Resumen · 6. IPsec" },
{ b:"seg", q:"¿Qué es una SA en IPsec?",
  o:["Son aplicaciones seguras que utilizan los usuarios dentro de la LAN, para asegurar la integridad de los datos.","Es una conexión simple entre dos puntos finales y tiene un identificador de seguridad asociado con ella.","Ninguna de las opciones.","Sirve para identificar la aplicación y de esta forma se controla qué usuario puede utilizarla.","Es una conexión segura entre Router."], c:[1],
  why:"Aunque IPsec está en capa de red, es orientado a conexión: una SA (Security Association) es una conexión simplex entre dos extremos con un identificador de seguridad.",
  src:"Resumen · 6. IPsec (SA)" },
{ b:"seg", q:"¿Qué función tiene AH en IPsec?",
  o:["Integridad.","Cifrado.","Ninguna de las opciones.","Confidencialidad."], c:[0],
  why:"AH (Authentication Header) da integridad y autenticación, pero no cifra. Para confidencialidad se usa ESP.",
  src:"Resumen · 6. IPsec (AH / ESP)" },
{ b:"seg", q:"¿Qué se utiliza para la confidencialidad en la estructura de IPsec? (Elija dos)",
  o:["RSA.","PSK.","SHA.","DES.","MD5.","SEAL."], c:[3,5],
  why:"En el framework IPsec, la confidencialidad usa DES, 3DES, AES o SEAL. MD5 y SHA son para integridad, y PSK y RSA para autenticación.",
  src:"Resumen · 6. IPsec (framework)" },
{ b:"seg", q:"¿Entre qué capas IPsec inserta su encabezado, cuando trabaja a modo túnel o de transporte?",
  o:["Aplicación y transporte.","Transporte y red.","Ninguna de las opciones.","Red y enlace de datos."], c:[1],
  why:"El encabezado IPsec (AH o ESP) va después del encabezado IP y antes del de TCP/UDP, o sea entre la capa de red y la de transporte.",
  src:"Resumen · 6. IPsec (modos)" },
{ b:"seg", q:"¿Qué dispositivo encapsula y desencapsula paquetes cuando se utiliza modo túnel en IPsec?",
  o:["Switch.","Ninguna de las opciones.","Firewall.","Switch de capa 3.","Router."], c:[2],
  why:"En modo túnel todo el paquete IP se encapsula en uno nuevo. Lo hace el firewall de la empresa, y las máquinas de la LAN no saben que existe IPsec.",
  src:"Resumen · 6. IPsec (modo túnel)" },
{ b:"seg", q:"SSL construye una conexión segura entre dos sockets, incluyendo:",
  o:["Ninguna de las opciones.","Autenticación del cliente por el servidor.","Protección de la confidencialidad de los datos.","Negociación de parámetros entre el cliente y el servidor.","Verificación del cliente."], c:[2],
  why:"SSL brinda comunicación secreta (confidencialidad) e integridad, y es el cliente quien autentica al servidor, no al revés. Esta es la respuesta del FORMS.",
  nota:"Tanenbaum también menciona la negociación de parámetros entre cliente y servidor, pero el FORMS toma como única correcta la confidencialidad.",
  src:"Resumen · 6. SSL/TLS" },
{ b:"seg", q:"Una vez realizados todos los pasos de SSL y comienzan a transferir información entre origen y destino, ¿qué clave se utiliza para encriptar y desencriptar la información?",
  o:["Clave de sesión.","Clave asimétrica.","Clave permanente.","Ninguna de las opciones."], c:[0],
  why:"La clave pública se usa solo en el acuerdo, para intercambiar una clave de sesión simétrica. Desde ahí, todos los datos se cifran con esa clave de sesión porque es mucho más rápida.",

// ---------- utilidades ----------
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hash = s => { let h = 5381; for (const ch of s) h = ((h << 5) + h + ch.charCodeAt(0)) | 0; return (h >>> 0).toString(36); };
PREGUNTAS.forEach((p, i) => { p.id = hash(p.b + "|" + p.q + "|" + p.o.join("|")); p.i = i; });
const bloque = id => BLOQUES.find(b => b.id === id);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// ---------- persistencia ----------
const LS = "simulador-p3-redes";
let DB = { st: {}, mezclarOpc: true, mezclarPreg: true };
try { DB = Object.assign(DB, JSON.parse(localStorage.getItem(LS) || "{}")); } catch (e) {}
const guardar = () => { try { localStorage.setItem(LS, JSON.stringify(DB)); } catch (e) {} };
function registrar(p, ok) {
  const s = DB.st[p.id] || { a: 0, ok: 0, last: null };
  s.a++; if (ok) s.ok++; s.last = ok; DB.st[p.id] = s; guardar();
}
const falladas = () => PREGUNTAS.filter(p => DB.st[p.id] && DB.st[p.id].last === false);

// ---------- navegación ----------
let Q = null; // estado del cuestionario en curso
function ir(v, arg) {
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.v === v || (v === "quiz" && Q && Q.modo === "sim" && b.dataset.v === "simulacro")));
  window.scrollTo(0, 0);
  ({ inicio: vInicio, simulacro: vSimulacro, repaso: vRepaso, stats: vStats, quiz: vQuiz, res: vRes })[v](arg);
}
document.querySelectorAll("#nav button").forEach(b => b.onclick = () => ir(b.dataset.v));

// ---------- bloques aleatorios (estables por semilla) ----------
const N_BLOQUES = 4;
if (!DB.seed) { DB.seed = Math.floor(Math.random() * 1e9) + 1; }
DB.tema = DB.tema || "todos"; DB.estado = DB.estado || "todas";
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function bloquesAleatorios() {
  const r = rng(DB.seed);
  const a = PREGUNTAS.slice().sort((x, y) => x.id < y.id ? -1 : 1);
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  const tam = Math.ceil(a.length / N_BLOQUES);
  return Array.from({ length: N_BLOQUES }, (_, k) => a.slice(k * tam, (k + 1) * tam));
}
const filtrarEstado = ps => DB.estado === "nuevas" ? ps.filter(p => !DB.st[p.id])
  : DB.estado === "mal" ? ps.filter(p => DB.st[p.id] && DB.st[p.id].last === false) : ps;
const ETQ_ESTADO = { todas: "", nuevas: " · no respondidas", mal: " · incorrectas" };

// ---------- INICIO ----------
function vInicio() {
  const nf = falladas().length;
  app.innerHTML = `
  <div class="card hero">
    <span class="tag">Práctica por bloques</span>
    <h1 class="tit" style="margin-top:10px">Practicá el Parcial 3 de Redes de Datos</h1>
    <p class="lead" style="margin:0">${PREGUNTAS.length} preguntas del FORMS. Elegí un bloque o filtrá por tema; al responder ves si está bien o mal y una justificación corta sacada del resumen o las filminas.</p>
    <div class="toolbar">
      <select id="tema" class="sel-tema">
        <option value="todos">Todos los temas</option>
        ${BLOQUES.map(b => `<option value="${b.id}" ${DB.tema === b.id ? "selected" : ""}>${b.n}. ${esc(b.titulo)}</option>`).join("")}
      </select>
      <div class="chips">
        ${[["todas", "Todas"], ["nuevas", "No respondidas"], ["mal", "Incorrectas"]].map(([k, t]) => `<button class="chip ${DB.estado === k ? "on" : ""}" data-e="${k}">${t}</button>`).join("")}
      </div>
    </div>
    <div class="acc">
      <button class="btn" id="pt">Practicar selección</button>
      ${nf ? `<button class="btn sec" onclick="empezar(falladas(),'Repaso de errores','prac')">Repasar errores (${nf})</button>` : ""}
      <button class="btn sec" onclick="ir('simulacro')">Simulacro de parcial</button>
      ${DB.tema === "todos" ? `<button class="btn sec" id="rb">Rearmar bloques</button>` : ""}
    </div>
    <div class="opts">
      <label><input type="checkbox" id="mp" ${DB.mezclarPreg ? "checked" : ""}> Mezclar el orden de las preguntas</label>
      <label><input type="checkbox" id="mo" ${DB.mezclarOpc ? "checked" : ""}> Mezclar las opciones</label>
    </div>
  </div>
  <div class="grid">${cardsInicio()}</div>`;
  $("#tema").onchange = e => { DB.tema = e.target.value; guardar(); vInicio(); };
  app.querySelectorAll(".chip[data-e]").forEach(c => c.onclick = () => { DB.estado = c.dataset.e; guardar(); vInicio(); });
  $("#pt").onclick = () => {
    const base = DB.tema === "todos" ? PREGUNTAS : PREGUNTAS.filter(p => p.b === DB.tema);
    const t = DB.tema === "todos" ? "Todos los temas" : `${bloque(DB.tema).n}. ${bloque(DB.tema).titulo}`;
    lanzar(filtrarEstado(base), t + ETQ_ESTADO[DB.estado]);
  };
  const rb = $("#rb"); if (rb) rb.onclick = () => { DB.seed = Math.floor(Math.random() * 1e9) + 1; guardar(); vInicio(); };
  $("#mp").onchange = e => { DB.mezclarPreg = e.target.checked; guardar(); };
  $("#mo").onchange = e => { DB.mezclarOpc = e.target.checked; guardar(); };
}
function lanzar(ps, titulo) {
  if (!ps.length) { const g = app.querySelector(".grid"); g.insertAdjacentHTML("beforebegin", `<p class="aviso">No hay preguntas con ese filtro todavía.</p>`); setTimeout(() => { const a = app.querySelector(".aviso"); if (a) a.remove(); }, 2500); return; }
  empezar(ps, titulo, "prac");
}
let CARDS = [];
const CORTO = { tr: "Transporte", dns: "DNS/Correo", nat: "NAT/PAT", app: "FTP/SNMP/HTTP", seg: "Seguridad" };
function cardsInicio() {
  if (DB.tema === "todos") {
    CARDS = bloquesAleatorios().map((ps, k) => {
      const mix = BLOQUES.map(b => [b, ps.filter(p => p.b === b.id).length]).filter(x => x[1]);
      return { n: k + 1, titulo: `Bloque ${k + 1}`, sub: "Mezcla de todos los temas", ps, mix };
    });
  } else {
    const b = bloque(DB.tema);
    CARDS = [{ n: b.n, titulo: b.titulo, sub: b.sub, ps: PREGUNTAS.filter(p => p.b === b.id) }];
  }
  return CARDS.map((c, i) => cardBloque(c, i)).join("");
}
function cardBloque(c, i) {
  const ps = c.ps;
  const vistas = ps.filter(p => DB.st[p.id]).length;
  const bien = ps.filter(p => DB.st[p.id] && DB.st[p.id].last).length;
  const pct = Math.round(100 * bien / ps.length);
  const sel = filtrarEstado(ps).length;
  return `<div class="card bloque">
    <div style="display:flex;gap:12px;align-items:center"><div class="num">${c.n}</div><div><h3>${esc(c.titulo)}</h3><p>${esc(c.sub)}</p></div></div>
    <div class="meta"><span>${ps.length} preguntas · ${vistas} hechas</span><span title="Respondidas bien la última vez">${pct}% ✓</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="row">
      <button class="btn" onclick="practicarCard(${i})" ${sel ? "" : "disabled"}>${DB.estado === "todas" ? "Practicar" : `Practicar (${sel})`}</button>
    </div>
  </div>`;
}
function practicarCard(i) {
  const c = CARDS[i];
  lanzar(filtrarEstado(c.ps), (DB.tema === "todos" ? c.titulo : `${c.n}. ${c.titulo}`) + ETQ_ESTADO[DB.estado]);
}

// ---------- SIMULACRO ----------
function vSimulacro() {
  app.innerHTML = `
  <h1 class="tit">Simulacro de parcial</h1>
  <p class="lead">Preguntas al azar de todos los bloques, repartidas en proporción. No ves las respuestas hasta terminar, como en el parcial. Al final tenés la nota sobre 10 y la corrección de cada pregunta.</p>
  <div class="grid">
    ${[10, 20, 30].map(n => `<div class="card bloque">
      <div style="display:flex;gap:12px;align-items:center"><div class="num">${n}</div><div><h3>${n} preguntas</h3><p>${n === 10 ? "Rápido, unos 10 minutos" : n === 20 ? "Formato tipo parcial" : "Repaso largo"}</p></div></div>
      <div class="row"><button class="btn" onclick="simulacro(${n})">Empezar</button></div>
    </div>`).join("")}
  </div>`;
}
function simulacro(n) {
  // reparto proporcional por bloque
  const sel = [];
  const tot = PREGUNTAS.length;
  BLOQUES.forEach(b => {
    const ps = shuffle(PREGUNTAS.filter(p => p.b === b.id));
    sel.push(...ps.slice(0, Math.max(1, Math.round(n * ps.length / tot))));
  });
  let fin = shuffle(sel).slice(0, n);
  if (fin.length < n) fin = fin.concat(shuffle(PREGUNTAS.filter(p => !fin.includes(p))).slice(0, n - fin.length));
  empezar(fin, `Simulacro · ${n} preguntas`, "sim", true);
}

// ---------- CUESTIONARIO ----------
function empezar(lista, titulo, modo, yaMezclado) {
  if (!lista.length) return;
  let ps = lista.slice();
  if (DB.mezclarPreg && !yaMezclado) ps = shuffle(ps);
  Q = {
    titulo, modo, idx: 0, bien: 0, mal: 0,
    items: ps.map(p => ({ p, orden: ordenOpc(p), sel: [], resp: false, ok: null }))
  };
  ir("quiz");
}
function ordenOpc(p) {
  const idx = p.o.map((_, i) => i);
  if (!DB.mezclarOpc) return idx;
  const ning = idx.filter(i => /^ninguna de las opciones/i.test(p.o[i]));
  return shuffle(idx.filter(i => !ning.includes(i))).concat(ning);
}
function vQuiz() {
  if (!Q) return ir("inicio");
  const it = Q.items[Q.idx], p = it.p, multi = p.c.length > 1;
  const n = Q.items.length, b = bloque(p.b);
  const sim = Q.modo === "sim";
  const lock = it.resp;
  const opts = it.orden.map((oi, k) => {
    let cls = "opt " + (multi ? "check" : "radio");
    if (it.sel.includes(oi)) cls += " sel";
    if (lock) {
      cls += " lock";
      const esC = p.c.includes(oi), elegida = it.sel.includes(oi);
      if (esC && elegida) cls += " good";
      else if (!esC && elegida) cls += " bad";
      else if (esC) cls += " good miss";
    }
    return `<button class="${cls}" data-oi="${oi}"><span class="mk"></span><span class="k">${k + 1}</span><span>${esc(p.o[oi])}</span></button>`;
  }).join("");
  app.innerHTML = `
  <div class="qtop">
    <span class="tag">${esc(Q.titulo)}</span>
    ${sim ? "" : `<span class="score">✓ ${Q.bien}<b>✕ ${Q.mal}</b></span>`}
    <span class="cont">Pregunta ${Q.idx + 1} de ${n}</span>
  </div>
  <div class="bar"><i style="width:${100 * (Q.idx + (lock ? 1 : 0)) / n}%"></i></div>
  <div class="card qcard">
    <div style="margin-bottom:8px"><span class="tag">${b.n}. ${esc(b.titulo)}</span></div>
    <p class="qtext">${esc(p.q)}</p>
    <div class="hint">${multi ? `Seleccioná ${p.c.length} opciones` : "Seleccioná una opción"}</div>
    ${p.img ? `<div class="qimg"><img src="${IMGS[p.img]}" alt="Imagen de la pregunta" onclick="zoom(this.src)"></div>` : ""}
    <div class="olist">${opts}</div>
    ${lock && !sim ? feedback(it) : ""}
    <div class="qact">
      ${Q.idx > 0 && sim ? `<button class="btn sec" onclick="mover(-1)">← Anterior</button>` : ""}
      <button class="btn sec" onclick="salir()">Salir</button>
      ${sim
        ? `<button class="btn" id="go" onclick="simSig()" ${it.sel.length ? "" : "disabled"}>${Q.idx === n - 1 ? "Terminar y corregir" : "Siguiente →"}</button>`
        : lock
          ? `<button class="btn" id="go" onclick="sig()">${Q.idx === n - 1 ? "Ver resultados" : "Siguiente →"}</button>`
          : `<button class="btn" id="go" onclick="responder()" ${it.sel.length ? "" : "disabled"}>Responder</button>`}
    </div>
  </div>`;
  if (!lock || sim) app.querySelectorAll(".opt").forEach(el => el.onclick = () => elegir(+el.dataset.oi));
}
function elegir(oi) {
  const it = Q.items[Q.idx], multi = it.p.c.length > 1;
  if (it.resp && Q.modo !== "sim") return;
  if (multi) it.sel = it.sel.includes(oi) ? it.sel.filter(x => x !== oi) : it.sel.concat(oi);
  else it.sel = [oi];
  vQuiz();
}
const esOk = it => it.sel.length === it.p.c.length && it.p.c.every(c => it.sel.includes(c));
function responder() {
  const it = Q.items[Q.idx];
  if (!it.sel.length || it.resp) return;
  it.resp = true; it.ok = esOk(it);
  it.ok ? Q.bien++ : Q.mal++;
  registrar(it.p, it.ok);
  vQuiz();
  const fb = app.querySelector(".fb"); if (fb) fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
}
function feedback(it) {
  const p = it.p;
  const corr = p.c.map(i => esc(p.o[i])).join(" · ");
  return `<div class="fb ${it.ok ? "ok" : "no"}">
    <h4>${it.ok ? "✓ ¡Correcto!" : "✕ Incorrecto"}</h4>
    ${it.ok ? "" : `<p class="ans"><b>Respuesta correcta:</b> ${corr}</p>`}
    <p class="why">${esc(p.why)}</p>
    ${p.nota ? `<div class="nota"><b>Ojo:</b> ${esc(p.nota)}</div>` : ""}
    <div class="src">${esc(p.src)}</div>
  </div>`;
}
function sig() { if (Q.idx < Q.items.length - 1) { Q.idx++; ir("quiz"); } else ir("res"); }
function mover(d) { Q.idx = Math.max(0, Math.min(Q.items.length - 1, Q.idx + d)); ir("quiz"); }
function simSig() {
  const it = Q.items[Q.idx]; if (!it.sel.length) return;
  if (Q.idx < Q.items.length - 1) { Q.idx++; ir("quiz"); return; }
  Q.items.forEach(x => { x.resp = true; x.ok = esOk(x); x.ok ? Q.bien++ : Q.mal++; registrar(x.p, x.ok); });
  ir("res");
}
function salir() {
  if (Q && Q.modo === "prac" && (Q.bien + Q.mal) > 0) { Q.items = Q.items.filter(x => x.resp); ir("res"); }
  else { Q = null; ir("inicio"); }
}
function zoom(src) { $("#zoomimg").src = src; $("#zoom").classList.add("on"); }

// ---------- RESULTADOS ----------
function vRes() {
  if (!Q) return ir("inicio");
  const tot = Q.items.length, bien = Q.items.filter(x => x.ok).length;
  const nota = tot ? Math.round(100 * bien / tot) / 10 : 0;
  const malas = Q.items.filter(x => !x.ok).map(x => x.p);
  const msj = nota >= 8 ? "¡Muy bien! Estás en zona de 8 o más." : nota >= 6 ? "Vas bien, repasá los errores para llegar al 8." : "Repasá los errores con el resumen al lado y volvé a intentar.";
  app.innerHTML = `
  <div class="card res">
    <span class="tag">${esc(Q.titulo)}</span>
    <div class="big" style="margin-top:14px">${nota.toString().replace(".", ",")}<small> / 10</small></div>
    <p style="font-size:18px;margin:10px 0 4px"><b>${bien}</b> de <b>${tot}</b> correctas</p>
    <p class="lead" style="margin:0">${msj}</p>
    <div class="acc">
      ${malas.length ? `<button class="btn" id="rf">Reintentar las ${malas.length} falladas</button>` : ""}
      <button class="btn sec" onclick="Q=null;ir('inicio')">Volver al inicio</button>
    </div>
  </div>
  <h2 style="margin:28px 0 6px;color:var(--rojo-osc)">Corrección</h2>
  <div class="rev">${Q.items.map(revItem).join("")}</div>`;
  if (malas.length) $("#rf").onclick = () => empezar(malas, "Reintento de falladas", "prac");
}
function revItem(x) {
  const p = x.p, b = bloque(p.b);
  const li = p.o.map((o, i) => {
    const c = p.c.includes(i), s = x.sel.includes(i);
    if (!c && !s) return "";
    return `<li class="${c ? "c" : "x"}">${esc(o)}${c && s ? " ✓" : c ? " (correcta)" : " (tu respuesta)"}</li>`;
  }).join("");
  return `<div class="card ritem ${x.ok ? "ok" : "no"}">
    <span class="tag">${b.n}. ${esc(b.titulo)}</span> <b style="color:${x.ok ? "var(--ok)" : "var(--mal)"}">${x.ok ? "✓ Correcta" : "✕ Incorrecta"}</b>
    <div class="rq">${esc(p.q)}</div>
    ${p.img ? `<img src="${IMGS[p.img]}" alt="" onclick="zoom(this.src)" style="max-width:420px;cursor:zoom-in">` : ""}
    <ul>${li}</ul>
    <div class="why">${esc(p.why)}</div>
    ${p.nota ? `<div class="nota"><b>Ojo:</b> ${esc(p.nota)}</div>` : ""}
    <div class="src">📖 ${esc(p.src)}</div>
  </div>`;
}

// ---------- REPASO ----------
let RF = { b: "todos", t: "" };
function vRepaso() {
  app.innerHTML = `
  <h1 class="tit">Repaso</h1>
  <p class="lead">Todas las preguntas con su respuesta correcta y la justificación. Sirve para leer junto con el resumen impreso.</p>
  <div class="filtros">
    <button class="chip" data-b="todos">Todos</button>
    ${BLOQUES.map(b => `<button class="chip" data-b="${b.id}">${b.n}. ${esc(b.titulo)}</button>`).join("")}
    <input class="buscar" id="bus" placeholder="Buscar (ej.: MIME, puerto, IPsec)…" value="${esc(RF.t)}">
  </div>
  <div class="rev" id="rlist"></div>`;
  app.querySelectorAll(".chip").forEach(c => c.onclick = () => { RF.b = c.dataset.b; pintarRepaso(); });
  $("#bus").oninput = e => { RF.t = e.target.value; pintarRepaso(); };
  pintarRepaso();
}
function pintarRepaso() {
  app.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c.dataset.b === RF.b));
  const t = RF.t.trim().toLowerCase();
  const ps = PREGUNTAS.filter(p => (RF.b === "todos" || p.b === RF.b) &&
    (!t || (p.q + " " + p.o.join(" ") + " " + p.why).toLowerCase().includes(t)));
  $("#rlist").innerHTML = ps.length ? ps.map(p => revItem({ p, sel: p.c, ok: true })
    .replace(/<b style="color:var\(--ok\)">✓ Correcta<\/b>/, "").replace(/ ✓<\/li>/g, "</li>")).join("")
    : `<p class="lead">No hay preguntas que coincidan.</p>`;
}

// ---------- ESTADÍSTICAS ----------
function vStats() {
  const filas = BLOQUES.map(b => {
    const ps = PREGUNTAS.filter(p => p.b === b.id);
    const a = ps.reduce((s, p) => s + (DB.st[p.id] ? DB.st[p.id].a : 0), 0);
    const ok = ps.reduce((s, p) => s + (DB.st[p.id] ? DB.st[p.id].ok : 0), 0);
    const vistas = ps.filter(p => DB.st[p.id]).length;
    return { t: `${b.n}. ${b.titulo}`, n: ps.length, vistas, a, ok };
  });
  const T = filas.reduce((s, f) => ({ t: "Total", n: s.n + f.n, vistas: s.vistas + f.vistas, a: s.a + f.a, ok: s.ok + f.ok }), { n: 0, vistas: 0, a: 0, ok: 0 });
  const pc = f => f.a ? Math.round(100 * f.ok / f.a) + "%" : "–";
  app.innerHTML = `
  <h1 class="tit">Estadísticas</h1>
  <p class="lead">Se guardan en este navegador. “Aciertos” cuenta todos los intentos.</p>
  <table class="st">
    <tr><th>Bloque</th><th>Preguntas</th><th>Vistas</th><th>Intentos</th><th>Aciertos</th></tr>
    ${filas.concat(T).map(f => `<tr><td>${esc(f.t)}</td><td>${f.n}</td><td>${f.vistas}</td><td>${f.a}</td><td>${pc(f)}</td></tr>`).join("")}
  </table>
  <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">
    <button class="btn sec" id="rst">Borrar estadísticas</button>
  </div>`;
  const r = $("#rst");
  r.onclick = () => {
    if (r.dataset.c) { DB.st = {}; guardar(); vStats(); }
    else { r.dataset.c = 1; r.textContent = "¿Seguro? Tocá de nuevo para borrar"; }
  };
}

// ---------- teclado ----------
document.addEventListener("keydown", e => {
  if (!Q || !app.querySelector(".qcard") || e.target.tagName === "INPUT") return;
  const it = Q.items[Q.idx];
  if (/^[1-9]$/.test(e.key)) { const oi = it.orden[+e.key - 1]; if (oi !== undefined) elegir(oi); }
  if (e.key === "Enter") { const g = $("#go"); if (g && !g.disabled) { e.preventDefault(); g.click(); } }
});

ir("inicio");
</script>
</body>
</html>

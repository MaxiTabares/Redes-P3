<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador · Parcial 3 · Redes de Datos</title>
<meta name="description" content="Cuestionario interactivo para practicar el tercer parcial de Redes de Datos (4K4).">
<meta name="theme-color" content="#C8102E">
<style>
:root{
  --rojo:#C8102E; --rojo-osc:#9E0B22; --rojo-claro:#FDECEF; --rojo-borde:#e3c4ca;
  --tinta:#1d1d1f; --gris:#6b6b70; --linea:#ececec; --fondo:#fbf7f7;
  --ok:#1f8a4c; --ok-claro:#e8f6ee; --mal:#C8102E; --mal-claro:#fdecef;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;color:var(--tinta);background:var(--fondo);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
/* ---------- header ---------- */
header{background:var(--rojo);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(158,11,34,.25)}
.hwrap{max-width:1040px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.15;cursor:pointer}
.brand small{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.brand b{font-size:20px}
nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
nav button{background:transparent;border:0;color:#fff;padding:8px 14px;border-radius:999px;font-weight:600;opacity:.9}
nav button:hover{background:rgba(255,255,255,.14);opacity:1}
nav button.on{background:#fff;color:var(--rojo);opacity:1}
main{max-width:1040px;margin:0 auto;padding:26px 20px 60px}
footer{text-align:center;color:var(--gris);font-size:13px;padding:0 20px 30px}
/* ---------- comunes ---------- */
h1.tit{font-size:28px;margin:0 0 4px;color:var(--rojo-osc)}
.lead{color:var(--gris);margin:0 0 22px}
.btn{border:2px solid var(--rojo);background:var(--rojo);color:#fff;padding:10px 18px;border-radius:10px;font-weight:700;transition:.15s}
.btn:hover{background:var(--rojo-osc);border-color:var(--rojo-osc)}
.btn.sec{background:#fff;color:var(--rojo)}
.btn.sec:hover{background:var(--rojo-claro)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.card{background:#fff;border:1px solid var(--linea);border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.tag{display:inline-block;background:var(--rojo-claro);color:var(--rojo-osc);font-weight:700;font-size:12px;padding:3px 10px;border-radius:999px;letter-spacing:.02em}
.bar{height:8px;background:#f1e3e5;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--rojo);border-radius:99px;transition:width .3s}
/* ---------- inicio ---------- */
.hero{padding:26px;margin-bottom:22px;background:linear-gradient(135deg,#fff 0%,#fff 60%,var(--rojo-claro) 100%);border-left:6px solid var(--rojo)}
.hero .acc{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.opts{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;color:var(--gris);font-size:14px}
.opts label{display:flex;align-items:center;gap:6px;cursor:pointer}
.opts input{accent-color:var(--rojo)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.bloque{padding:20px;display:flex;flex-direction:column;gap:10px;transition:.15s;border-top:4px solid var(--rojo)}
.bloque:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(158,11,34,.12)}
.bloque .num{width:34px;height:34px;border-radius:10px;background:var(--rojo);color:#fff;display:grid;place-items:center;font-weight:800}
.bloque h3{margin:0;font-size:18px}
.bloque p{margin:0;color:var(--gris);font-size:14px}
.bloque .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--gris)}
.bloque .row{display:flex;gap:8px;margin-top:auto;padding-top:4px}
.bloque .row .btn{flex:1;padding:8px 10px;font-size:14px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:16px;padding-top:16px;border-top:1px solid var(--linea)}
.sel-tema{flex:1;min-width:240px;padding:10px 12px;border:2px solid var(--rojo-borde);border-radius:10px;font:inherit;font-weight:600;color:var(--rojo-osc);background:#fff;cursor:pointer}
.sel-tema:focus{outline:none;border-color:var(--rojo)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.mix{display:flex;gap:6px;flex-wrap:wrap}
.mix span{font-size:12px;background:var(--rojo-claro);color:var(--rojo-osc);padding:2px 8px;border-radius:99px;font-weight:600}
.aviso{background:#fff7e6;border:1px solid #f1d39a;border-radius:10px;padding:10px 14px;margin:0 0 14px}
/* ---------- quiz ---------- */
.qtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.qtop .cont{margin-left:auto;font-size:14px;color:var(--gris);font-weight:600}
.qtop .score{font-size:14px;font-weight:700;color:var(--ok)}
.qtop .score b{color:var(--mal);margin-left:8px}
.qcard{padding:26px;margin-top:14px}
.qtext{font-size:19px;font-weight:650;margin:0 0 6px}
.hint{font-size:13px;color:var(--rojo);font-weight:700;margin-bottom:14px}
.qimg{margin:6px 0 16px;text-align:center}
.qimg img{max-width:100%;border:1px solid var(--linea);border-radius:10px;cursor:zoom-in}
.olist{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:2px solid var(--linea);border-radius:12px;background:#fff;cursor:pointer;text-align:left;transition:.12s;width:100%}
.opt:hover{border-color:var(--rojo-borde);background:#fffafa}
.opt .mk{flex:none;width:22px;height:22px;border:2px solid #c9c9cf;margin-top:1px;display:grid;place-items:center;font-size:13px;color:#fff;font-weight:800}
.opt.radio .mk{border-radius:50%}
.opt.check .mk{border-radius:6px}
.opt .k{flex:none;font-size:12px;color:var(--gris);margin-top:3px;min-width:14px}
.opt.sel{border-color:var(--rojo);background:var(--rojo-claro)}
.opt.sel .mk{border-color:var(--rojo);background:var(--rojo)}
.opt.sel.radio .mk::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.opt.sel.check .mk::after{content:"✓"}
.opt.lock{cursor:default}
.opt.lock:hover{background:#fff;border-color:var(--linea)}
.opt.good{border-color:var(--ok)!important;background:var(--ok-claro)!important}
.opt.good .mk{border-color:var(--ok);background:var(--ok)}
.opt.good .mk::after{content:"✓"!important;width:auto!important;height:auto!important;background:none!important}
.opt.bad{border-color:var(--mal)!important;background:var(--mal-claro)!important}
.opt.bad .mk{border-color:var(--mal);background:var(--mal)}
.opt.bad .mk::after{content:"✕"!important;width:auto!important;height:auto!important;background:none!important}
.opt.miss{border-style:dashed!important;border-color:var(--ok)!important}
.opt.miss .mk{background:#fff;border-color:var(--ok)}
.opt.miss .mk::after{content:""!important}
.opt.miss::after{content:"correcta";margin-left:auto;font-size:12px;font-weight:700;color:var(--ok);align-self:center}
.qact{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.fb{margin-top:18px;border-radius:12px;padding:16px 18px;border-left:6px solid}
.fb.ok{background:var(--ok-claro);border-color:var(--ok)}
.fb.no{background:var(--mal-claro);border-color:var(--mal)}
.fb h4{margin:0 0 6px;font-size:17px}
.fb.ok h4{color:var(--ok)} .fb.no h4{color:var(--mal)}
.fb .ans{font-size:14px;margin:0 0 8px}
.fb .why{margin:0}
.fb .src{margin-top:8px;font-size:12.5px;color:var(--gris)}
.fb .src::before{content:"📖 "}
.nota{margin-top:10px;font-size:13.5px;background:#fff7e6;border:1px solid #f1d39a;border-radius:8px;padding:8px 10px}
.nota b{color:#9a6200}
/* ---------- resultados ---------- */
.res{padding:28px;text-align:center}
.big{font-size:64px;font-weight:800;color:var(--rojo);line-height:1}
.big small{font-size:24px;color:var(--gris)}
.res .acc{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.rev{margin-top:20px;display:flex;flex-direction:column;gap:12px}
.ritem{padding:16px 18px;border-left:5px solid var(--linea)}
.ritem.ok{border-left-color:var(--ok)} .ritem.no{border-left-color:var(--mal)}
.ritem .rq{font-weight:650;margin:6px 0}
.ritem ul{margin:6px 0 0;padding-left:20px}
.ritem li.c{color:var(--ok);font-weight:650}
.ritem li.x{color:var(--mal);text-decoration:line-through}
.ritem .why{color:#333;font-size:14.5px;margin-top:8px}
.ritem .src{font-size:12.5px;color:var(--gris);margin-top:4px}
.ritem img{max-width:100%;border:1px solid var(--linea);border-radius:8px;margin-top:6px}
/* ---------- repaso ---------- */
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.chip{cursor:pointer;border:2px solid var(--rojo-borde);background:#fff;color:var(--rojo-osc);padding:6px 12px;border-radius:999px;font-weight:600;font-size:14px}
.chip.on{background:var(--rojo);border-color:var(--rojo);color:#fff}
.buscar{flex:1;min-width:200px;padding:9px 12px;border:2px solid var(--linea);border-radius:10px;font:inherit}
.buscar:focus{outline:none;border-color:var(--rojo)}
/* ---------- stats ---------- */
table.st{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
table.st th{background:var(--rojo);color:#fff;text-align:left;padding:10px 14px;font-size:14px}
table.st td{padding:10px 14px;border-bottom:1px solid var(--linea)}
table.st tr:last-child td{border-bottom:0;font-weight:700;background:var(--rojo-claro)}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;place-items:center;z-index:50;cursor:zoom-out;padding:20px}
.zoom img{max-width:100%;max-height:100%;background:#fff;border-radius:8px}
.zoom.on{display:grid}
@media (max-width:640px){
  .qcard{padding:18px} .qtext{font-size:17px} h1.tit{font-size:23px} .hwrap{padding:10px 14px} nav button{padding:6px 10px;font-size:14px}
}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="brand" onclick="ir('inicio')"><small>Redes de Datos · 4K4</small><b>Simulador · Parcial 3</b></div>
  <nav id="nav">
    <button data-v="inicio">Inicio</button>
    <button data-v="simulacro">Simulacro</button>
    <button data-v="repaso">Repaso</button>
    <button data-v="stats">Estadísticas</button>
  </nav>
</div></header>
<main id="app"></main>
<footer>Preguntas tomadas del FORMS del 3er parcial · Justificaciones basadas en el resumen y las filminas de la cátedra · Sin preguntas de QoS ni MPLS (Parcial 2)</footer>
<div class="zoom" id="zoom" onclick="this.classList.remove('on')"><img id="zoomimg" alt=""></div>

<script>
// Banco de preguntas del Parcial 3 (Redes de Datos 4K4).
// Base: "FORMS 3er Parcial redes de datos" (respuesta correcta del formulario).
// Se excluyeron las preguntas de Calidad de Servicio y MPLS (Unidad 4, Parcial 2).
// c = índices (base 0) de las opciones correctas, en el orden en que están escritas.
// img = clave de la imagen en IMGS. nota = aviso cuando la clave del FORMS se corrigió.

const BLOQUES = [
  { id: "tr",  n: 1, titulo: "Capa de Transporte", sub: "TCP, UDP, puertos y sockets" },
  { id: "dns", n: 2, titulo: "DNS y Correo electrónico", sub: "DNS, SMTP, POP3, IMAP, MIME" },
  { id: "nat", n: 3, titulo: "NAT y PAT", sub: "Traducción de direcciones" },
  { id: "app", n: 4, titulo: "FTP, TFTP, SNMP y HTTP", sub: "Aplicación, 2da parte" },
  { id: "seg", n: 5, titulo: "Seguridad", sub: "Criptografía, firmas, firewall, IPsec, VPN, SSL" }
];

const PREGUNTAS = [
// ======================= 1. CAPA DE TRANSPORTE =======================
{ b:"tr", q:"¿Cómo se identifican las aplicaciones que se ejecutan en un servidor o puesto de trabajo de un usuario?",
  o:["Puertos.","Ninguna de las opciones.","Por el tipo de aplicación.","Por la dirección IP del servidor."], c:[0],
  why:"Los puertos identifican el proceso de aplicación dentro de un host (son la dirección de la capa de transporte). La IP identifica al equipo, no a la aplicación.",
  src:"Resumen · 1. Transporte (Direccionamiento)" },
{ b:"tr", q:"Un puerto lógico está formado por:",
  o:["144 bits","32 bits","16 bits","8 bits","48 bits","24 bits"], c:[2],
  why:"Un puerto tiene 16 bits, por eso va de 0 a 65.535. 32 bits es una IPv4 y 48 bits una MAC.",
  src:"Resumen · 1. Transporte (Direccionamiento)" },
{ b:"tr", q:"¿Cómo se llaman los puertos menores a 1024, los cuales están reservados para los servicios estándar?",
  o:["Puertos privados.","Puertos registrados.","Ninguna de las opciones.","Puertos dinámicos.","Puertos bien conocidos."], c:[4],
  why:"0–1023 son los puertos bien conocidos (HTTP 80, SMTP 25, DNS 53…). 1024–49151 son registrados y 49152–65535 dinámicos/privados, que usan los clientes.",
  src:"Filmina 3-01 · Puertos" },
{ b:"tr", q:"La forma de identificar un socket como punto de conexión entre transmisor y receptor es:",
  o:["Número de puerto + Dirección MAC.","Dirección IP + Dirección MAC.","Depende de la cantidad de dispositivos que se conecten al servidor.","Dirección IP + Número de puerto.","Dirección MAC + Dirección IP.","Depende de la tecnología de la capa de enlace.","Número de proceso + Dirección MAC."], c:[3],
  why:"Socket = dirección IP + número de puerto. La MAC no interviene en transporte: cambia en cada salto, mientras que el socket identifica la comunicación extremo a extremo.",
  src:"Resumen · 1. Transporte (TCP, características)" },
{ b:"tr", q:"¿A qué denominamos puntos terminales en el modelo del servicio TCP?",
  o:["Ninguna de las opciones.","Al puesto de trabajo origen y destino.","A las aplicaciones del origen y del destino.","A la dirección IP y al puerto.","Al usuario del origen y del destino."], c:[3],
  why:"Transmisor y receptor crean puntos terminales llamados sockets, que se forman con la dirección IP y el puerto. Las aplicaciones se identifican por el puerto, pero el punto terminal es el par IP:puerto.",
  src:"Resumen · 1. Transporte (TCP, características)" },
{ b:"tr", q:"Se están transfiriendo datos entre dos dispositivos “A” y “B” ubicados físicamente en países diferentes. Para identificar de forma única dicha comunicación de capa de transporte, es necesario que origen y destino lleven el registro de (seleccione varias):",
  o:["Dirección IP de la puerta de enlace de A","Dirección IP de B","Dirección MAC de A","Puerto de B","Puerto de A","Dirección IP de la puerta de enlace de B","Dirección IP de A","Dirección MAC de B"], c:[1,3,4,6],
  why:"Toda comunicación TCP queda identificada por 4 valores: IP origen, puerto origen, IP destino y puerto destino (los dos sockets). Las MAC y los gateways son de capa de enlace/red y cambian en el camino.",
  src:"Resumen · 1. Transporte (Uso de sockets)" },
{ b:"tr", q:"Desde una computadora se han iniciado dos conexiones FTP diferentes, una hacia ftp.frc.utn.edu.ar y otra hacia ftp.ietf.org. ¿Cuántos sockets TCP intervienen en total en las dos conexiones?",
  o:["Siete","Cinco","Cuatro","Seis","Depende de la capacidad de los servidores","Dos","Tres"], c:[2],
  why:"Cada conexión TCP es punto a punto y tiene un socket en cada extremo (PC y servidor). Dos conexiones → 2 × 2 = 4 sockets.",
  src:"Resumen · 1. Transporte (Uso de sockets)" },
{ b:"tr", q:"¿En qué divide TCP los datos de las aplicaciones que utiliza el usuario en su puesto de trabajo?",
  o:["Paquetes.","Segmentos.","Tren de bits.","Tramas.","Ninguna de las opciones."], c:[1],
  why:"La PDU de transporte es el segmento. En el origen TCP divide la corriente de datos en segmentos; los paquetes son de red y las tramas de enlace.",
  src:"Resumen · 1. Transporte (TCP, características)" },
{ b:"tr", q:"TCP en el destino de una transmisión:",
  o:["Reensambla los datos provenientes de la capa de aplicación, extrayéndole la cabecera","Segmenta los datos provenientes de la capa de aplicación y les agrega una cabecera","Reensambla los datos provenientes de la capa de interred y los entrega a la capa de aplicación","Segmenta los datos provenientes de la capa de interred y les agrega una cabecera"], c:[2],
  why:"En el destino TCP recibe los segmentos desde la capa de interred (IP), los ordena y reensambla, y los entrega a la aplicación. Segmentar y agregar cabecera es lo que hace en el origen.",
  src:"Resumen · 1. Transporte (TCP, características)" },
{ b:"tr", q:"¿Cuáles de las siguientes características corresponden al protocolo TCP? Seleccione dos opciones:",
  o:["Un socket se identifica mediante la dirección IP y el número de puerto.","Implementa conexiones semiduplex a través de sockets.","Todos los segmentos de una comunicación siguen el mismo camino físico.","En el destino de la transmisión multiplexa los datos provenientes de diferentes aplicaciones.","En el destino de la transmisión recibe datos de la capa interred y los entrega ordenados a la capa de aplicación.","Es un protocolo seguro porque cifra toda la comunicación.","Establece una conexión lógica y física extremo a extremo."], c:[0,4],
  why:"Socket = IP + puerto, y en el destino TCP entrega los datos ordenados a la aplicación. Es full dúplex, la conexión es solo lógica (los segmentos pueden ir por caminos distintos), no cifra, y en el destino demultiplexa (multiplexa en el origen).",
  src:"Resumen · 1. Transporte" },
{ b:"tr", q:"¿Cómo son todas las conexiones TCP?",
  o:["Half dúplex.","Full dúplex.","Ninguna de las opciones.","Simplex."], c:[1],
  why:"TCP brinda conexiones dúplex y punto a punto: los datos viajan en ambos sentidos a la vez, con un socket para cada sentido.",
  src:"Resumen · 1. Transporte (TCP, características)" },
{ b:"tr", q:"¿Cuál de las siguientes opciones es un servicio fiable?",
  o:["BOOTP","Ninguna de las opciones.","FTP.","TFTP."], c:[2],
  why:"FTP corre sobre TCP, que garantiza que todos los datos lleguen, ordenados e íntegros. BOOTP y TFTP corren sobre UDP, que no es fiable.",
  src:"Resumen · 1. Transporte (Servicio fiable y no fiable)" },
{ b:"tr", q:"¿Cuál de las siguientes opciones NO es un servicio fiable?",
  o:["POP3.","TFTP.","HTTP.","SMTP.","Ninguna de las opciones."], c:[1],
  why:"TFTP corre sobre UDP (puerto 69), que es no fiable. POP3, HTTP y SMTP usan TCP.",
  src:"Resumen · 1. Transporte / 4. TFTP" },
{ b:"tr", q:"Cuáles de las siguientes aplicaciones corren sobre el protocolo TCP (seleccione varias opciones):",
  o:["SMTP","FTP","HTTP","DNS","TFTP","SNMP"], c:[0,1,2],
  why:"SMTP (25), FTP (21/20) y HTTP (80) necesitan fiabilidad, entonces usan TCP. DNS (53), TFTP (69) y SNMP (161/162) usan UDP porque priorizan rapidez.",
  src:"Resumen · 7. Repaso (tabla de puertos)" },
{ b:"tr", q:"Cuáles de las siguientes aplicaciones corren sobre el protocolo UDP (seleccione varias opciones):",
  o:["FTP","SNMP","POP3","TFTP","HTTP","DNS","SMTP"], c:[1,3,5],
  why:"TFTP (69), DNS (53) y SNMP (161/162) usan UDP: son consultas cortas donde importa la velocidad. FTP, POP3, HTTP y SMTP usan TCP.",
  src:"Resumen · 7. Repaso (tabla de puertos)" },
{ b:"tr", q:"Cuáles de las siguientes aplicaciones utilizan UDP como protocolo de transporte (seleccione dos opciones):",
  o:["Transferencia de correo electrónico","Resolución de dominios en direcciones IP","Transferencia de páginas Web","Protocolo BGP","Protocolo RIP","Transferencia de archivos"], c:[1,5],
  why:"La resolución de dominios es DNS (UDP 53) y la transferencia de archivos se refiere a TFTP (UDP 69). Correo (SMTP) y web (HTTP) usan TCP. Esta es la respuesta que marca el FORMS.",
  src:"Resumen · 7. Repaso (tabla de puertos)" },
{ b:"tr", q:"¿Quién se encarga de las retransmisiones en UDP?",
  o:["El mismo UDP.","Ninguna de las opciones.","La aplicación.","La capa de red."], c:[2],
  why:"UDP no tiene ACK ni temporizadores, así que no retransmite. Si se necesita control, se programa en la propia aplicación (como hace TFTP con su ACK por bloque).",
  src:"Resumen · 1. Transporte (Servicio fiable y no fiable)" },
{ b:"tr", q:"Cuáles de los siguientes campos forman parte de la cabecera del protocolo UDP, seleccione tres opciones:",
  o:["Opciones","Puertos origen y destino","Bit ACK","Número de reconocimiento","Tamaño de ventana","Suma de comprobación","Longitud","Número de secuencia"], c:[1,5,6],
  why:"La cabecera UDP tiene solo 8 bytes: puerto origen, puerto destino, longitud y suma de comprobación. Secuencia, reconocimiento, ventana y flags son de TCP.",
  src:"Resumen · 1. Transporte (UDP, formato)" },
{ b:"tr", q:"Cuáles de los siguientes campos permiten implementar la “fiabilidad” del protocolo TCP (seleccione dos opciones):",
  o:["Longitud de la cabecera.","Número de secuencia.","Puntero urgente.","Etiqueta de flujo.","Suma de verificación."], c:[1,4],
  why:"El número de secuencia permite reordenar y detectar faltantes, y la suma de verificación garantiza la integridad del segmento. Etiqueta de flujo ni siquiera es de TCP (es de IPv6).",
  src:"Resumen · 1. Transporte (Formato del segmento)" },
{ b:"tr", q:"¿Cuáles de los siguientes campos utiliza el protocolo TCP para garantizar fiabilidad extremo a extremo? Seleccione tres opciones:",
  o:["Número de reconocimiento.","Puntero urgente.","Bit PSH.","Número de secuencia.","Bits ECE y CWR.","Ventana de congestión.","Tamaño de ventana de recepción.","Suma de verificación.","Tamaño del flujo."], c:[0,3,7],
  why:"Fiabilidad = que todo llegue, ordenado e íntegro: secuencia (orden), reconocimiento/ACK (confirmar o retransmitir) y suma de verificación (integridad). Las ventanas son de control de flujo y congestión.",
  src:"Resumen · 1. Transporte (Formato del segmento)" },
{ b:"tr", q:"¿Cuál de los siguientes campos utiliza el protocolo TCP para implementar control de flujo extremo a extremo?",
  o:["Bits ECE y CWR.","Ventana de congestión.","Tamaño del flujo.","Puntero urgente.","Número de reconocimiento.","Tamaño de ventana de recepción."], c:[5],
  why:"Control de flujo (emisor rápido vs. receptor lento, extremo a extremo) se hace con la ventana de recepción. La ventana de congestión y ECE/CWR son de control de congestión, que afecta a toda la red.",
  src:"Resumen · 1. Transporte (OJO PARCIAL control de flujo)" },
{ b:"tr", q:"¿Cuáles de las siguientes afirmaciones corresponden al campo “ventana de recepción” del encabezado de un segmento TCP (seleccione dos opciones)?",
  o:["Es un valor fijo establecido en el inicio de la conexión.","Si el valor de la ventana = 0, implica detener momentáneamente la transmisión de datos.","Permite ordenar los segmentos en el receptor.","Se utiliza para confirmar la recepción de los segmentos.","Implementa control de congestión extremo a extremo.","Es un valor dinámico y varía durante la comunicación."], c:[1,5],
  why:"La ventana anuncia el espacio libre en el búfer del receptor, así que cambia todo el tiempo; con Ventana = 0 el emisor no transmite por el momento. Ordenar es del número de secuencia y confirmar es del ACK.",
  src:"Resumen · 1. Transporte (Control de flujo)" },
{ b:"tr", q:"La máquina A está enviando datos a Internet a través de una conexión TCP a la máquina B a una tasa de 8 Mbps, determinada por la ventana de congestión. La máquina A envía un segmento a B y al recibir el correspondiente acuse de recibo, el campo ventana de recepción de B indica 6000 bytes. ¿Qué hará la máquina A?",
  o:["Continuará transmitiendo a 8 Mbps hasta que B le envíe una ventana de recepción = 0.","Reducirá la tasa de transmisión a 6000 bytes hacia B.","Detendrá la transmisión hacia B, porque el búfer del receptor está lleno.","Continuará transmitiendo a 8 Mbps ya que recibió un acuse de recibo del segmento enviado.","Continuará transmitiendo a 8 Mbps porque ese es el valor de la ventana de congestión."], c:[0],
  why:"Una ventana de 6000 bytes solo dice que B todavía tiene lugar en su búfer, así que A sigue transmitiendo. Recién cuando B anuncie Ventana = 0 tiene que detenerse (control de flujo). “6000 bytes” no es una tasa.",
  src:"Resumen · 1. Transporte (Control de flujo)" },
{ b:"tr", q:"¿Para qué sirve el campo número de confirmación de recepción?",
  o:["Especifica el siguiente segmento en el orden esperado.","Especifica el número de segmentos ya recibidos por el origen.","Ninguna de las opciones.","Especifica el siguiente paquete en el orden esperado.","Especifica el siguiente byte en el orden esperado."], c:[4],
  why:"TCP numera bytes, no segmentos. El número de confirmación contiene el siguiente byte esperado: si recibí hasta el 1000, mando 1001.",
  src:"Resumen · 1. Transporte (Formato del segmento)" },
{ b:"tr", q:"En el campo número de reconocimiento (asentimiento) de un segmento que “A” le envía a “B”, figura el valor 1800. Esto implica que:",
  o:["B recibió correctamente hasta el byte 1799 inclusive","A recibió correctamente hasta el byte 1799 inclusive","A recibió correctamente hasta el byte 1800 inclusive","B recibió correctamente hasta el byte 1800 inclusive","El próximo segmento que A le envíe a B comenzará a partir del byte 1800"], c:[1],
  why:"El reconocimiento lo pone quien recibió (A) e indica el próximo byte que espera: 1800, o sea que recibió bien hasta el 1799. El byte desde el que A envía lo da su número de secuencia, no el de reconocimiento.",
  src:"Resumen · 1. Transporte (Formato del segmento)" },
{ b:"tr", q:"¿En qué campo del segmento TCP lee el emisor para reenviar información selectiva que el receptor no recibió?",
  o:["Número de confirmación de recepción.","Apuntador de urgente.","Tamaño de ventana.","Ninguna de las opciones.","Opciones."], c:[4],
  why:"La confirmación selectiva (SACK) viaja en el campo Opciones: el receptor informa qué rangos de bytes recibió, y el emisor reenvía solo los que faltan.",
  src:"Filmina 3-01 · Campos de la cabecera TCP" },
{ b:"tr", q:"La función del parámetro MSS que se negocia al inicio de una conexión TCP es determinar:",
  o:["La cantidad de sockets que se deberán abrir para esa comunicación","El caudal máximo que podrá utilizar esa conexión TCP","La cantidad máxima de datos que se podrá enviar sin recibir un acuse de recibo","El tamaño máximo que podrán tener los segmentos","El tamaño máximo de la ventana de recepción"], c:[3],
  why:"MSS (Maximum Segment Size) es el tamaño máximo de datos que acepta cada extremo por segmento. Viaja en Opciones de los segmentos SYN. Lo que se puede enviar sin ACK lo limita la ventana.",
  src:"Resumen · 1. Transporte (Opciones)" },
{ b:"tr", q:"En el saludo de tres vías del protocolo TCP:",
  o:["El primer segmento intercambiado tiene encendidos los bits SYN y ACK","El segundo segmento intercambiado tiene encendidos los bits SYN y RESET","El primer segmento intercambiado tiene encendido el bit FIN","El segundo segmento intercambiado tiene encendidos los bits SYN y URG","El tercer segmento intercambiado tiene encendido el bit ACK"], c:[4],
  why:"Saludo de tres vías: 1) SYN, 2) SYN + ACK, 3) ACK. El único enunciado correcto es el del tercer segmento (el segundo lleva SYN y ACK, no RST ni URG).",
  src:"Resumen · 1. Transporte (Establecimiento de la conexión)" },
{ b:"tr", q:"En el saludo de tres vías del protocolo TCP (otra versión):",
  o:["El segundo segmento intercambiado tiene encendidos los bits SYN y RESET","El primer segmento intercambiado tiene encendido el bit FIN","El tercer segmento intercambiado tiene encendidos los bits SYN y ACK","El segundo segmento intercambiado tiene encendidos los bits SYN y ACK","El primer segmento intercambiado tiene encendidos los bits SYN y ACK"], c:[3],
  why:"Saludo de tres vías: 1) el cliente envía SYN, 2) el servidor responde SYN + ACK, 3) el cliente confirma con ACK. El tercero lleva solo ACK y el primero solo SYN; FIN y RST no participan del establecimiento.",
  src:"Resumen · 1. Transporte (Establecimiento de la conexión)" },
{ b:"tr", q:"¿Quién envía un segmento TCP marcando el campo ECE?",
  o:["El destino.","El origen.","Dispositivos intermedios.","El ISP.","Ninguna de las opciones."], c:[0],
  why:"Un router congestionado marca el paquete IP (ECN), pero quien avisa al emisor es el destino, encendiendo ECE en el ACK. El origen responde con CWR al reducir su ventana de congestión.",
  src:"Resumen · 1. Transporte (Control de congestión)" },
{ b:"tr", q:"Se está estableciendo una comunicación entre dos dispositivos A y B. Si el emisor desea avisar al receptor que ya redujo la tasa de transferencia de datos a la red, tiene que activar en la cabecera del protocolo TCP:",
  o:["El bit SYN.","No tiene que activar nada del encabezado.","El bit URG.","El bit CWR.","La ventana de congestión.","La ventana de recepción.","El bit ECE."], c:[3],
  why:"CWR (Congestion Window Reduced) lo enciende el emisor para avisar que ya redujo su ventana de congestión, en respuesta a un ECE del receptor. La ventana de congestión es una variable interna, no un campo de la cabecera.",
  src:"Resumen · 1. Transporte (Control de congestión)" },
{ b:"tr", q:"Un administrador de red está analizando un extracto de WireShark y observa que el puerto origen tiene un valor de 80. ¿Qué significa esto?",
  o:["Ninguna de las opciones.","Es una respuesta de un servidor.","Es una consulta de un cliente.","Son datos de actualización de tabla de enrutamiento entre los routers.","Es una respuesta de un switch.","Es la respuesta de un router."], c:[1],
  why:"Los servidores escuchan en puertos bien conocidos (80 = HTTP). Si el puerto origen es 80, el segmento sale del servidor web: es una respuesta. Un cliente usaría un puerto dinámico como origen.",
  src:"Resumen · 1. Transporte (Puertos)" },
{ b:"tr", q:"Cuáles de las siguientes afirmaciones son correctas a partir de la siguiente captura de Wireshark (seleccione dos opciones):", img:"ws_synack",
  o:["El segmento debe entregarse de inmediato a la aplicación en el destino","Es un segmento proveniente desde un servidor DNS","El servidor Web acepta la conexión e inicia un nuevo socket hacia la PC","El servidor Web le informa a la PC el tamaño máximo del segmento y el escalado de ventana que manejará","El servidor Web recibió correctamente datos de la PC hasta el byte 65534 inclusive","Es un segmento de finalización de conexión entre una PC y un servidor Web"], c:[2,3],
  why:"Flags SYN + ACK con puerto origen 443: es el 2º paso del saludo de tres vías, el servidor web acepta la conexión y abre su socket hacia la PC. En Opciones informa el MSS y el escalado de ventana. No es DNS (53), no hay PSH ni FIN.",
  src:"Resumen · 1. Transporte (Establecimiento de la conexión)" },
{ b:"tr", q:"Cuáles de las siguientes afirmaciones son correctas a partir de la siguiente captura de Wireshark (seleccione dos opciones):", img:"ws_syn",
  o:["La PC le informa al servidor Web su tamaño máximo del segmento y su escalado de ventana","Es un segmento de finalización de conexión entre una PC y un servidor Web","La PC cliente recibió correctamente datos desde el Servidor Web hasta el byte 1 inclusive","El servidor Web recibió correctamente datos de la PC hasta el byte 64240 inclusive","Es un segmento proveniente desde un servidor Web","Una PC desea iniciar una conexión con un servidor Web","El segmento debe entregarse de inmediato a la aplicación en el destino"], c:[0,5],
  why:"Solo SYN encendido, puerto origen dinámico (52886) y destino 443: la PC inicia la conexión con un servidor web (1º paso del saludo). En Opciones anuncia su MSS y escalado de ventana. ACK = 0, así que todavía no confirma datos.",
  src:"Resumen · 1. Transporte (Establecimiento de la conexión)" },
{ b:"tr", q:"Cuáles de las siguientes afirmaciones son correctas a partir de la siguiente captura de Wireshark (seleccione dos opciones):", img:"ws_ack",
  o:["Es un segmento de establecimiento de conexión entre una PC y un servidor Web","El segmento debe entregarse de inmediato a la aplicación en el destino","Se están enviando datos urgentes en el segmento","Es un segmento destinado a un servidor HTTPS","Es un segmento de finalización de conexión entre una PC y un servidor Web","La PC cliente recibió correctamente datos desde el servidor web hasta el byte 48 inclusive","El servidor web recibió correctamente datos de la PC hasta el byte 48 inclusive"], c:[3,5],
  why:"Puerto destino 443 → va hacia un servidor HTTPS. Lo envía la PC (puerto 59256) con solo ACK y Acknowledgment = 49: la PC recibió del servidor hasta el byte 48 inclusive. No es establecimiento: no hay SYN y en el 3er paso del saludo el ACK valdría 1.",
  nota:"El FORMS marca “Es un segmento de establecimiento de conexión”, pero la captura no tiene SYN y el ACK es 49, no 1. Acá se toma como correcta la que surge de leer la captura.",
  src:"Resumen · 1. Transporte (Formato del segmento)" },
{ b:"tr", q:"Cuáles de las siguientes afirmaciones son correctas a partir de la siguiente captura de Wireshark (seleccione dos opciones):", img:"ws_fin",
  o:["Es un segmento de establecimiento de conexión entre una PC y un servidor Web","Se están enviando datos urgentes en el segmento","La PC recibió correctamente datos desde el servidor Web hasta el byte 1298 inclusive","Es un segmento destinado a un servidor HTTPS","El segmento debe entregarse de inmediato a la aplicación en el destino","El servidor Web recibió correctamente datos de la PC hasta el byte 3067 inclusive","El servidor Web le informa a la PC que finalizará la conexión del socket","El servidor Web recibió correctamente datos desde la PC hasta el byte 1298 inclusive"], c:[6,7],
  why:"Puerto origen 443: lo envía el servidor web. Flags FIN + ACK: avisa que cierra su lado de la conexión. Acknowledgment = 1299: el servidor recibió de la PC hasta el byte 1298 inclusive. No va hacia un servidor (el destino es un puerto dinámico).",
  src:"Resumen · 1. Transporte (Liberación de la conexión)" },

// ======================= 2. DNS Y CORREO =======================
{ b:"dns", q:"¿Cuál es el uso principal de DNS?",
  o:["Ninguna de las opciones.","Asociar los nombres de host con direcciones MAC.","Asociar las direcciones IP con direcciones MAC.","Asociar los nombres de host con direcciones IP."], c:[3],
  why:"DNS traduce nombres de dominio a direcciones IP (y al revés). Asociar IP con MAC es tarea de ARP.",
  src:"Resumen · 2. DNS" },
{ b:"dns", q:"La forma de DNS asocia un nombre con una dirección IP, lo realiza con un programa de aplicación, que llama a un procedimiento de biblioteca. ¿Cómo se llama a ese procedimiento?",
  o:["Ninguna de las opciones.","Resolvedor.","Asociador","Relacionador.","Resolutor."], c:[1],
  why:"La aplicación llama a un procedimiento de biblioteca llamado resolvedor (resolver), que arma la consulta UDP al servidor DNS local y devuelve la IP a la aplicación.",
  src:"Filmina 3-02 · DNS / Tanenbaum 7.1" },
{ b:"dns", q:"¿Qué campo de registro de recursos me indica la estabilidad del registro para DNS?",
  o:["Tiempo_de_vida.","Clase","Ninguna de las opciones.","Nombre_dominio.","Valor.","Tipo."], c:[0],
  why:"El TTL (tiempo de vida) indica cuán estable es el registro y cuánto tiempo puede quedar en caché. Registros muy estables tienen TTL grandes, y los que cambian seguido, TTL chicos.",
  src:"Resumen · 2. DNS (Registros de recursos)" },
{ b:"dns", q:"¿Qué significado tiene el valor MX en el campo tipo del registro de recursos para DNS?",
  o:["Ninguna de las opciones.","Es de origen mexicano.","Intercambio de correo.","Sirve para ser utilizado entre sistemas operativos diferentes."], c:[2],
  why:"MX = Mail eXchange: indica el servidor de correo que acepta mensajes para ese dominio.",
  src:"Resumen · 2. DNS (Registros de recursos)" },
{ b:"dns", q:"Si se realiza una consulta a un servidor DNS y se obtienen los registros de recursos de un campo tipo MX, la información que se obtiene es:",
  o:["La dirección MAC de una máquina","El nombre del servidor de correo de un dominio","El servidor de nombres de un dominio","El servidor Web de un dominio","La dirección IPv4 de una máquina","La dirección IPv6 de una máquina"], c:[1],
  why:"Un registro MX devuelve el nombre del servidor de correo del dominio. NS da el servidor de nombres, A la IPv4 y AAAA la IPv6.",
  src:"Resumen · 2. DNS (Registros de recursos)" },
{ b:"dns", q:"Luego de realizar una consulta a un servidor DNS se obtiene como resultado 201.56.89.10, eso implica que se solicitó el registro de recurso de tipo:",
  o:["IPv4","SOA","NS","PTR","MX","AAAA","A"], c:[6],
  why:"201.56.89.10 es una IPv4, y el registro que la contiene es el tipo A. “IPv4” no es un tipo de registro, y AAAA es para IPv6.",
  src:"Resumen · 2. DNS (Registros de recursos)" },
{ b:"dns", q:"Si se ejecuta el comando nslookup y se establece type=NS se obtendrá:",
  o:["La dirección IPv4 de un dominio","El administrador del dominio","La dirección IPv6 de un dominio","Los servicios brindados por dicho dominio","El servidor DNS de un dominio","El servidor de correo de un dominio"], c:[4],
  why:"NS (Name Server) devuelve los servidores DNS autorizados del dominio. El administrador del dominio sale en el registro SOA.",
  src:"Resumen · 2. DNS (nslookup)" },
{ b:"dns", q:"Si se ejecuta el comando nslookup y se establece type=AAAA, se obtendrá:",
  o:["Los servicios brindados por dicho dominio","La dirección IPv4 de un dominio","El servidor DNS de un dominio","El administrador del dominio","El servidor de correo de un dominio","La dirección IPv6 de un dominio"], c:[5],
  why:"AAAA es el registro de dirección IPv6 (128 bits, de ahí las cuatro A). Para IPv4 es type=A.",
  src:"Resumen · 2. DNS (nslookup)" },
{ b:"dns", q:"Qué comando permite borrar o vaciar la memoria caché de resolución de DNS de nuestra PC:",
  o:["Ipconfig /all","Ipconfig /flushdns","Ipconfig /displaydns","Ipconfig /cleardns","Ipconfig /renew","Ipconfig /deletedns","Ipconfig /release"], c:[1],
  why:"ipconfig /flushdns vacía la caché DNS. /displaydns la muestra, /all muestra la configuración (incluido el DNS local) y /renew y /release son de DHCP. /cleardns y /deletedns no existen.",
  src:"Resumen · 2. DNS (Caché)" },
{ b:"dns", q:"El servidor DNS que posee información acerca de cada dominio de nivel superior del árbol de dominios es:",
  o:["Servidor de correo","Caché DNS del servidor Local","Servidor autorizado de nombres","Caché DNS de la PC","Servidor local","Servidor raíz"], c:[5],
  why:"Los servidores raíz conocen a los servidores de cada dominio de nivel superior (.ar, .com, .edu…) y derivan la consulta hacia ellos. El autorizado solo conoce su propia zona.",
  src:"Resumen · 2. DNS (Servidores de nombres)" },
{ b:"dns", q:"Un cliente DNS que se ejecuta en una computadora envía la consulta acerca de la traducción de un dominio a su servidor local. Si este servidor local no posee la respuesta, dicho servidor le realizará la consulta sobre el dominio a…",
  o:["c-root-servers.net","Base de datos local de la PC","La caché del cliente","Servidor autorizado de nombre"], c:[0],
  why:"Si el servidor local no lo tiene en caché, empieza por un servidor raíz (a-root… m-root-servers.net), que lo deriva al intermedio y este al autorizado. No sabe de antemano quién es el autorizado.",
  src:"Resumen · 2. DNS (Resolución de nombres)" },
{ b:"dns", q:"Cuál de los siguientes es el orden correcto para resolver un dominio mediante el DNS, cuando se escribe en el navegador “www.etsit.upm.es”:",
  o:["Caché local, servidor autorizado, servidor local, servidor raíz","Servidor local, servidor intermedio, servidor raíz, servidor autorizado","Caché local, servidor raíz, servidor local, servidor autorizado, servidor intermedio","Caché local, servidor local, servidor raíz, servidor intermedio, servidor autorizado","Caché local, servidor local, servidor autorizado, servidor raíz"], c:[3],
  why:"Primero se mira la caché de la PC; si no está, se pregunta al servidor local, que consulta al raíz, después al intermedio (.es) y por último al autorizado (upm.es), que tiene la IP.",
  src:"Resumen · 2. DNS (Resolución de nombres)" },
{ b:"dns", q:"Cuál de las siguientes consultas DNS se implementa actualmente en internet:",
  o:["Sólo Recursivas","Es aleatorio, cada servidor implementa cualquier tipo de consulta","Recursivas e iterativas","Solo Iterativas"], c:[3],
  why:"Entre servidores se resuelve de forma iterativa: los raíz y los TLD no atienden consultas recursivas porque están demasiado cargados, solo responden “preguntale a tal servidor”. Esta es la respuesta del FORMS.",
  src:"Resumen · 2. DNS (OJO PARCIAL consultas)" },
{ b:"dns", q:"La consulta DNS en la cual un servidor DNS devuelve la respuesta sin consultar a otros servidores DNS, incluso si no puede brindar una respuesta definitiva, se denomina:",
  o:["Consulta recursiva","Consulta estática","Servidor Autorizado de nombres","Consulta a la caché","Consulta DNS","Consulta iterativa"], c:[3],
  why:"Si el servidor responde con lo que tiene guardado en caché, no pregunta a nadie más. La respuesta puede no ser definitiva (“respuesta no autoritativa”) porque no viene del servidor autorizado. Esta es la respuesta del FORMS.",
  src:"Resumen · 2. DNS (Caché / nslookup)" },
{ b:"dns", q:"Si se captura un segmento en cuyo encabezado posee el puerto origen 53 y el puerto destino 52000, corresponde a:",
  o:["Una respuesta generada desde un servidor de correo IMAP hacia una PC.","Una solicitud generada desde una PC hacia un servidor de correo POP3.","Una solicitud generada desde una PC hacia un servidor de correo IMAP.","Una respuesta generada desde un servidor de correo POP3 hacia una PC.","Una respuesta generada desde un servidor DNS hacia una PC o servidor intermedio.","Una solicitud generada desde una PC hacia un servidor FTP."], c:[4],
  why:"53 es DNS. Como es el puerto de origen, sale del servidor: es una respuesta hacia el cliente, que usa un puerto dinámico (52000). IMAP es 143, POP3 110 y FTP 21.",
  src:"Resumen · 7. Repaso (tabla de puertos)" },
{ b:"dns", q:"Ana escribe un mensaje de correo electrónico en su computadora. El protocolo que se utiliza para mover el correo entre la PC y el servidor de correo es:",
  o:["SNMP","SMTP","FTP","HTTP","UDP","POP3","IMAP"], c:[1],
  why:"Para enviar (subir) el correo desde la PC al servidor se usa SMTP (TCP 25). POP3 e IMAP sirven para que el destinatario baje o lea sus mensajes.",
  src:"Resumen · 2. Correo electrónico" },
{ b:"dns", q:"El protocolo que se utiliza para el intercambio de mensajes de correo entre servidores de correo electrónico es:",
  o:["MIME","SMTP, IMAP y POP3","SNMP","HTTP","SMTP e IMAP","SMTP, IMAP, POP3 y MIME","SMTP"], c:[6],
  why:"Entre servidores (MTA a MTA) solo se usa SMTP. POP3 e IMAP son para el acceso final del usuario a su buzón, y MIME es un formato de mensaje, no un protocolo de transferencia.",
  src:"Resumen · 2. Correo electrónico" },
{ b:"dns", q:"¿Con qué puerto trabaja POP?",
  o:["20","Ninguna de las opciones","25","443","143","110"], c:[5],
  why:"POP3 escucha en TCP 110. 25 es SMTP, 143 IMAP, 443 HTTPS y 20 FTP datos.",
  src:"Resumen · 7. Repaso (tabla de puertos)" },
{ b:"dns", q:"¿Cuáles de las siguientes características corresponden al protocolo POP3? (Seleccione tres opciones).",
  o:["Corre sobre TCP puerto 143.","Protocolo complejo y potente.","Utilizado para enviar correo electrónico.","Corre sobre TCP puerto 110.","Protocolo sencillo.","Permite descargar mensajes en la computadora del usuario.","Permite consultar correo desde diferentes dispositivos.","Corre sobre UDP puerto 25."], c:[3,4,5],
  why:"POP3 es sencillo, corre sobre TCP 110 y descarga los mensajes a la PC del usuario (en general los borra del servidor). Consultar desde varios dispositivos, ser complejo y usar el puerto 143 son de IMAP. Enviar es de SMTP.",
  src:"Resumen · 2. Correo (POP3 vs IMAP)" },
{ b:"dns", q:"El protocolo que permite acceder a mensajes de correo electrónico desde cualquier dispositivo, corre sobre TCP y escucha en el puerto 143 es:",
  o:["FTP","HTTP","DNS","MIME","SNMP","SMTP","IMAP"], c:[6],
  why:"IMAP (TCP 143) deja los mensajes en el servidor, por eso se pueden consultar desde cualquier dispositivo. Es más complejo y potente que POP3.",
  src:"Resumen · 2. Correo (IMAP)" },
{ b:"dns", q:"Si se captura un segmento en cuyo encabezado posee el puerto origen 52000 y el puerto destino 143, corresponde a:",
  o:["Una respuesta generada desde un servidor de correo hacia una PC","Una respuesta generada desde un servidor DNS hacia una PC o servidor intermedio","Una solicitud generada desde una PC hacia un servidor de correo POP3","Una solicitud generada desde una PC hacia un servidor FTP","Una solicitud generada desde una PC hacia un servidor de correo IMAP"], c:[4],
  why:"Destino 143 = IMAP, y origen dinámico (52000) = cliente. Por lo tanto es una solicitud de una PC hacia un servidor IMAP.",
  src:"Resumen · 7. Repaso (tabla de puertos)" },
{ b:"dns", q:"¿Qué contiene la envoltura en el formato de los mensajes para SMTP? (Elija dos)",
  o:["Versión de SMTP.","Prioridad.","Nivel de seguridad.","Remitente.","Versión de POP."], c:[1,3],
  why:"La envoltura lleva la información para transferir el mensaje que usan los MTA: direcciones (remitente/destinatario) y prioridad. El encabezado es para los agentes de usuario y el cuerpo para el destinatario. Esta es la respuesta del FORMS.",
  src:"Filmina 3-02 · Formato del mensaje (envoltura / encabezado / cuerpo)" },
{ b:"dns", q:"¿Cuál de los siguientes campos de encabezado es usado por los usuarios o destinatarios en el protocolo SMTP?",
  o:["From.","In-Reply-To.","To.","Return-path.","Sender.","Ninguna de las opciones."], c:[2],
  why:"To indica las direcciones de los destinatarios primarios. Return-path lo agrega el último MTA y Sender o From identifican a quien envía. Esta es la respuesta del FORMS.",
  src:"Filmina 3-02 · Campos de encabezado RFC 822" },
{ b:"dns", q:"Cuáles de los siguientes campos son utilizados por los Agentes de Transferencia de Correo electrónico (seleccione tres):",
  o:["To","Received","Date","Bcc","Reply-to","Message-Id","Subject","Content-type"], c:[0,1,3],
  why:"Los MTA necesitan saber a quién entregar (To, Bcc) y van agregando Received en cada servidor que atraviesa el mensaje. Subject, Date y Message-Id los usa el agente de usuario. Esta es la respuesta del FORMS.",
  src:"Filmina 3-02 · Campos de encabezado RFC 822" },
{ b:"dns", q:"Cuáles de los siguientes campos son utilizados por los Agentes de Usuario de Correo electrónico (seleccione tres opciones):",
  o:["Subject","Bcc","Message-Id","To","From","Date","Received"], c:[0,2,5],
  why:"Subject, Date y Message-Id son información para el agente de usuario: mostrar el asunto, la fecha y relacionar mensajes. Received y los destinatarios los usan los MTA para transferir. Esta es la respuesta del FORMS.",
  src:"Filmina 3-02 · Campos de encabezado RFC 822" },
{ b:"dns", q:"Cuál de los siguientes campos corresponde a la cabecera del protocolo MIME:",
  o:["Return-path","Subject","Content-type","Date","Received"], c:[2],
  why:"MIME agrega cabeceras propias: MIME-Version, Content-Description, Content-Id, Content-Transfer-Encoding y Content-Type. Las demás son cabeceras RFC 822.",
  src:"Resumen · 2. Correo (MIME)" },
{ b:"dns", q:"¿Cuál de los siguientes campos corresponde a la cabecera del protocolo MIME?",
  o:["Received","Subject","Return-path","Date","Content-transfer-encoding"], c:[4],
  why:"Content-Transfer-Encoding es cabecera MIME e indica cómo se codifica el cuerpo para viajar como texto (por ejemplo base64). Received, Subject, Return-path y Date son RFC 822.",
  src:"Resumen · 2. Correo (MIME)" },
{ b:"dns", q:"Cuál de los siguientes NO es un “tipo de contenido” soportado en la cabecera del protocolo MIME:",
  o:["Text","Multipart","Message","Audio","Presentation","Image","Video"], c:[4],
  why:"Los tipos MIME son text, image, audio, video, application, message y multipart. “Presentation” no existe (una presentación viajaría como application/…).",
  src:"Resumen · 2. Correo (MIME, tipos)" },
{ b:"dns", q:"¿Qué se deberá configurar en el encabezado MIME si se desea enviar un archivo en formato PDF en un mensaje de correo electrónico?",
  o:["Type:PDF","Content-transfer-encoding:PDF","Content-type:PDF","Message-Id:Application","Application/PDF","Format/PDF"], c:[4],
  why:"Content-Type se escribe como tipo/subtipo. Un PDF es application/pdf. “Content-type:PDF” no sirve porque falta el tipo.",
  src:"Resumen · 2. Correo (MIME, tipos)" },
{ b:"dns", q:"Qué se deberá configurar en el encabezado MIME si se desea enviar una foto formato GIF en un mensaje de correo electrónico:",
  o:["Type:Gif","Format/Gif","Image/Gif","Message-Id:Image","Content-transfer-encoding:Gif","Content-type:Gif"], c:[2],
  why:"Una foto es tipo image, y el subtipo es el formato: image/gif (o image/jpeg).",
  src:"Resumen · 2. Correo (MIME, tipos)" },

// ======================= 3. NAT / PAT =======================
{ b:"nat", q:"La traducción de direcciones de red permite:",
  o:["Facilitar la implementación de DHCP","Ahorrar direcciones IP privadas","Facilitar la implementación del ARP","Ahorrar direcciones IPv4 públicas","Configurar direcciones IPv6"], c:[3],
  why:"NAT nació por la escasez de IPv4: muchos equipos con IP privadas salen a Internet con pocas (o una) IP públicas. Las privadas son libres, no hace falta ahorrarlas.",
  src:"Resumen · 3. NAT" },
{ b:"nat", q:"¿Cómo funciona NAT? (Elija dos)",
  o:["Traduce direcciones públicas de las LAN en direcciones privadas de WAN.","Traduce direcciones públicas de la WAN en direcciones privadas de LAN.","Traduce direcciones privadas de la LAN en direcciones públicas de WAN.","Traduce direcciones privadas de la WAN en direcciones públicas de la LAN."], c:[1,2],
  why:"Al salir, el router cambia la IP privada (LAN) por una pública (WAN). Al volver la respuesta, hace lo inverso: de la pública a la privada del equipo interno, usando su tabla de traducción.",
  src:"Resumen · 3. NAT" },
{ b:"nat", q:"Cuál de las siguientes es una ventaja de NAT estática:",
  o:["Ahorra direcciones IPv4 privadas","Permite compartir una única IP pública entre varios dispositivos de la empresa","Se pueden iniciar conexiones desde Internet hacia los servidores de una empresa","Ahorra direcciones IPv6","Requiere que el router de acceso mantenga tablas de traducción a nivel de puerto"], c:[2],
  why:"En NAT estática la traducción privada↔pública es fija (1 a 1), así que desde Internet se puede llegar siempre al mismo servidor interno. Compartir una IP es de PAT, y no ahorra IP públicas.",
  src:"Resumen · 3. NAT (estática)" },
{ b:"nat", q:"¿Cuál es el objetivo de tener NAT estática?",
  o:["Para que el ISP ingrese a la LAN, a solucionar problemas, en un puesto de trabajo.","Para tener control interno de los puestos finales de la LAN.","Para que los trabajadores internos egresen de la LAN.","Para que los trabajadores externos ingresen a la LAN.","Ninguna de las opciones."], c:[3],
  why:"La NAT estática sirve para que desde afuera (Internet) se pueda iniciar una conexión hacia un equipo interno, típicamente un servidor. Para salir alcanzan NAT dinámica o PAT.",
  src:"Resumen · 3. NAT (estática)" },
{ b:"nat", q:"Si se dispone de un conjunto de direcciones IPv4 públicas, las cuales se van asignando a los equipos internos de la empresa que desean conectarse a Internet, se dice que se trata de qué tipo de traducción:",
  o:["OSPF","Firewall","DHCP","NAT estática","Traducción a nivel de puerto","NAT dinámica"], c:[5],
  why:"NAT dinámica usa un pool de IP públicas que se asignan a demanda, una por equipo mientras dura su conexión, y después se liberan. En la estática la asignación es fija, y en PAT se comparte una IP usando puertos.",
  src:"Resumen · 3. NAT (dinámica)" },
{ b:"nat", q:"En una red local tenemos 400 PC con direcciones privadas que queremos que tengan salida a Internet, para lo cual disponemos de un rango de 80 direcciones IP públicas. Sabemos que nunca más del 20% estarán conectados simultáneamente y que las conexiones siempre se iniciarán desde la red privada. ¿Qué tipo de traducción debemos utilizar?",
  o:["NAT dinámico","Traducción a nivel de puerto","NAT estático","No se pueden tener tantas conexiones con direcciones privadas","Se puede utilizar cualquier tipo de traducción"], c:[0],
  why:"20% de 400 = 80 PC simultáneas, justo las 80 IP públicas del pool, y las conexiones salen siempre desde adentro: NAT dinámica. La estática necesitaría 400 públicas.",
  src:"Resumen · 3. NAT (dinámica)" },
{ b:"nat", q:"Un administrador de una empresa posee 600 puestos de trabajo con direccionamiento privado. El proveedor de servicios le asignó la IP 200.12.24.49 para la conexión a Internet. Si se sabe que nunca se conectarán hacia Internet más del 25% de los puestos de trabajo simultáneamente y que las conexiones siempre se iniciarán desde la organización, ¿qué tipo de traducción de red debería configurar el administrador en el router de acceso?",
  o:["DHCP","DHCP relay","ARP","NAT dinámica","NAT estática","Firewall","Traducción a nivel de puerto"], c:[6],
  why:"Hay una sola IP pública para 150 equipos simultáneos (25% de 600). La única forma es PAT (traducción a nivel de puerto): todos comparten la IP y se distinguen por el puerto.",
  src:"Resumen · 3. PAT" },
{ b:"nat", q:"La PC-B tiene una conexión con el servidor Web ubicado en Internet. Si el router está implementando PAT, ¿qué información tendrá el paquete que viaja desde el servidor Web de Internet hacia el router de la empresa?", img:"pat",
  o:["Origen: 34.5.6.7:80 - destino: 200.2.4.6:601","Origen: 10.10.10.15:50.602 - destino: 34.5.6.7:80","Origen: 34.5.6.7:80 - destino: 200.2.4.6:602","Origen: 34.5.6.7:50.602 - destino: 200.2.4.6:80","Origen: 200.2.4.6:50.602 - destino: 34.5.6.7:80","Origen: 200.2.4.6:50.601 - destino: 34.5.6.7:80"], c:[2],
  why:"La respuesta sale del servidor (34.5.6.7, puerto 80) y en Internet solo puede ir hacia la IP pública del router (200.2.4.6) con el puerto traducido que le asignó PAT a la PC-B. La IP privada nunca viaja por Internet.",
  src:"Resumen · 3. PAT" },
{ b:"nat", q:"La PC-B tiene una conexión con el servidor Web ubicado en Internet. Si el router está implementando PAT, ¿qué información tendrá el paquete que viaja desde el router hacia el servidor Web en Internet?", img:"pat",
  o:["Origen: 10.10.10.13:50.601 - destino: 34.5.6.7:80","Origen: 34.5.6.7:50.502 - destino: 200.2.4.6:580","Origen: 10.10.10.15:50.602 - destino: 34.5.6.7:80","Origen: 34.5.6.7:80 - destino: 200.2.4.6:602","Origen: 200.2.4.6:50.601 - destino: 34.5.6.7:80","Origen: 200.2.4.6:50.602 - destino: 34.5.6.7:80"], c:[5],
  why:"Al salir a Internet, PAT reemplaza la IP privada y el puerto de la PC-B (10.10.0.15:50.601) por la IP pública del router y el puerto traducido de la tabla (200.2.4.6:50.602). El destino es el servidor en el puerto 80. La IP privada nunca viaja por Internet.",
  nota:"Ningún documento trae la respuesta oficial de esta pregunta; se dedujo de la tabla de traducción del dibujo.",
  src:"Resumen · 3. PAT" },
{ b:"nat", q:"Una PC de una empresa tiene una conexión con un servidor Web ubicado en Internet. Considerando que el router de acceso de la empresa está implementando PAT, ¿qué información tendrá el paquete que viaja desde el router hacia la PC?",
  o:["Origen: 140.5.6.7:80 - destino: 172.16.3.6:53000.","Origen: 172.16.3.1:80 - destino: 172.16.3.6:53000.","Origen: 172.16.3.1:53000 - destino: 140.5.6.7:80.","Origen: 200.1.2.3:53000 - destino: 140.5.6.7:80.","Origen: 140.5.6.7:80 - destino: 200.1.2.3:53000."], c:[0],
  why:"Ya adentro de la LAN, el router deshizo la traducción: el origen sigue siendo el servidor (140.5.6.7:80) y el destino es la IP privada y el puerto original de la PC (172.16.3.6:53000). El router no pone su propia IP como origen.",
  src:"Resumen · 3. PAT" },
{ b:"nat", q:"La PC-B está descargando datos desde el Servidor Web. ¿Qué información contendrá el paquete que proviene desde el Servidor Web y que viaja por Internet?", img:"natdin",
  o:["Origen 200.12.4.7 - Destino 64.7.8.9","Origen 64.7.8.9 - Destino 10.10.0.6","Origen 64.7.8.9 - Destino 200.12.4.7","Origen 200.12.4.7 - Destino 10.10.0.6","Origen 64.7.8.9 - Destino 200.12.4.6","Origen 10.10.0.6 - Destino 64.7.8.9"], c:[2],
  why:"Con NAT dinámica, a la PC-B (10.10.0.6) se le asignó la pública 200.12.4.7. El paquete viene del servidor (origen 64.7.8.9) y por Internet va hacia la IP pública de la PC-B (200.12.4.7). La privada solo aparece adentro de la LAN.",
  nota:"El FORMS marca “Origen 200.12.4.7 – Destino 64.7.8.9”, pero ese es el sentido PC → servidor. El enunciado (y la flecha del dibujo) dice que el paquete sale del servidor, así que acá se toma la opción invertida.",
  src:"Resumen · 3. NAT (dinámica)" },

// ======================= 4. FTP, TFTP, SNMP, HTTP =======================
{ b:"app", q:"Cuáles de las siguientes son características del protocolo FTP (seleccione tres opciones):",
  o:["Corre sobre UDP puertos 21 y 20","Utiliza sólo conexiones no persistentes","Protocolo seguro y rápido","Mantiene una conexión de control para los comandos","Permite transferir datos entre clientes y servidores","Utiliza conexiones persistentes y no persistentes","La conexión de datos permanece activa hasta que el usuario cierra la sesión"], c:[3,4,5],
  why:"FTP transfiere archivos cliente-servidor con dos conexiones TCP: la de control (21, persistente, para los comandos) y la de datos (20, no persistente, una por archivo). Corre sobre TCP y es rápido pero no seguro.",
  src:"Resumen · 4. FTP" },
{ b:"app", q:"¿Cómo se denomina cuando el servidor FTP inicia la conexión?",
  o:["Modo activo","Ninguna de las opciones.","Modo pasivo.","Modo de servidor."], c:[0],
  why:"En modo activo es el servidor el que abre la conexión de datos (desde su puerto 20) hacia el cliente. En modo pasivo la inicia el cliente, útil cuando hay firewall o NAT.",
  src:"Filmina 3-04 · FTP (tipos de conexiones)" },
{ b:"app", q:"Cuál de las siguientes es una característica del protocolo TFTP:",
  o:["Autentica al usuario con usuario y contraseña","Corre sobre el protocolo UDP en el puerto 69","Requiere el establecimiento de una conexión","Brinda un servicio de transmisión de archivos no fiable","Utiliza el protocolo TCP de capa de transporte","Utiliza conexiones persistentes y no persistentes"], c:[1],
  why:"TFTP corre sobre UDP 69, no autentica y no establece conexión. Aunque UDP no sea fiable, TFTP agrega su propio ACK por bloque y retransmisión, por eso “no fiable” no es la característica que se pide.",
  src:"Resumen · 4. TFTP" },
{ b:"app", q:"¿Cuál de las siguientes es una característica del protocolo TFTP?",
  o:["Utiliza conexiones persistentes y no persistentes.","Realiza una transmisión de archivos de forma rápida y simple.","Utiliza el protocolo TCP de capa de transporte.","Autentica al usuario con usuario y contraseña.","Requiere el establecimiento de una conexión.","Brinda un servicio de transmisión de archivos no fiable."], c:[1],
  why:"La filmina lo define como “protocolo rápido y sencillo”: UDP 69, bloques de 512 bytes y cabecera de 4 bytes. Las conexiones persistentes, TCP y la autenticación son de FTP.",
  src:"Filmina 3-04 · TFTP" },
{ b:"app", q:"¿Mediante qué técnica se reenvían los paquetes no confirmados en TFTP?",
  o:["Expiración de temporizadores","El temporizador del destino expira y le avisa al origen que se lo reenvíe.","El destino le dice que no recibió nada y el emisor se lo reenvía.","Ninguna de las opciones."], c:[0],
  why:"Cada bloque se confirma con un ACK. Si el temporizador del emisor vence sin recibirlo, retransmite el bloque. El destino no avisa nada.",
  src:"Resumen · 4. TFTP" },
{ b:"app", q:"¿Qué tipo de paquete se utiliza para pedir permiso para leer un archivo en el servidor TFTP?",
  o:["RRQ.","WRQ.","ACK.","Ninguna de las opciones."], c:[0],
  why:"RRQ (Read Request) pide leer un archivo y WRQ (Write Request) pide escribirlo. Después vienen los paquetes DATA y sus ACK.",
  src:"Filmina 3-04 · TFTP / Tanenbaum" },
{ b:"app", q:"Julián desea centralizar la administración de los sistemas operativos instalados en todas sus computadoras y además desea respaldar toda la configuración de sus dispositivos en su empresa. Para ello, le aconsejaron que deberá configurar:",
  o:["Un servidor de correo electrónico","Un servidor DNS","Un servidor autorizado de nombres","Un servidor TFTP","Una Base de Información de Gestión","Un servidor HTTP","Un servidor raíz"], c:[3],
  why:"Entre las aplicaciones de TFTP están la gestión centralizada de sistemas operativos y configuración de dispositivos, y la carga de imágenes de SO en routers.",
  src:"Filmina 3-04 · TFTP (Aplicaciones)" },
{ b:"app", q:"Cuál de las siguientes NO es un área de la gestión de red definida por ISO:",
  o:["Gestión de cuentas","Gestión de fallos","Gestión de rendimiento","Gestión de seguridad","Gestión de planificación","Gestión de configuración"], c:[4],
  why:"Las 5 áreas ISO son rendimiento, fallos, configuración, cuentas y seguridad. La planificación no es una de ellas.",
  src:"Filmina 3-04 · Modelo de Gestión de Red ISO" },
{ b:"app", q:"Cuáles de los siguientes NO es un componente de la gestión de red:",
  o:["Agente de transferencia de mensajes","Dispositivos gestionados","Base de información de gestión","Protocolo SNMP","Estación administradora de red"], c:[0],
  why:"Los componentes SNMP son nodos gestionados, agente, NMS, MIB y protocolo SNMP. El agente de transferencia de mensajes (MTA) es del correo electrónico.",
  src:"Filmina 3-04 · Componentes SNMP" },
{ b:"app", q:"¿Cuáles de los siguientes NO es un componente de la gestión de red?",
  o:["Servidor autorizado de nombres","Base de información de gestión","Estación administradora de red","Protocolo SNMP","Dispositivos gestionados"], c:[0],
  why:"El servidor autorizado de nombres pertenece a DNS. Los componentes de gestión son dispositivos gestionados, agente, NMS, MIB y SNMP.",
  src:"Filmina 3-04 · Componentes SNMP" },
{ b:"app", q:"¿Cuál de los siguientes elementos no pertenece a la infraestructura para la gestión de red en SNMPv2?",
  o:["Gestor de elemento.","Agente.","Agente usuario.","Servidor de gestión.","Ninguna de las opciones."], c:[2],
  why:"El “agente usuario” es un término del correo electrónico (UA). En SNMP existen el agente (en el dispositivo) y la entidad/servidor de gestión (NMS).",
  src:"Filmina 3-04 · Componentes SNMP" },
{ b:"app", q:"Cuáles de las siguientes características corresponden a la base de información de administración:",
  o:["Permite conocer el servidor de correo de un determinado dominio","Contiene todo el árbol de dominios con sus correspondientes direcciones IP","Es una base que contiene información de los Routers de Internet","Es usada por DNS para obtener las direcciones IP de los Host de Internet","Contiene el conjunto de objetos administrados por el protocolo SNMP","Es usada para acceder al correo electrónico de las empresas"], c:[4],
  why:"La MIB (Management Information Base) contiene el conjunto de objetos (variables) administrados por SNMP, organizados en forma jerárquica (MIB-II). No tiene nada que ver con DNS ni con correo.",
  src:"Filmina 3-04 · MIB" },
{ b:"app", q:"¿En qué capa trabaja SNMP?",
  o:["Red.","Transporte.","Ninguna de las opciones.","Aplicación.","Presentación."], c:[3],
  why:"SNMP es un protocolo de capa de aplicación que corre sobre UDP (161 consultas, 162 traps).",
  src:"Resumen · 4. SNMP" },
{ b:"app", q:"Cuáles de los siguientes mensajes envía el agente SNMP a la estación administradora de red (seleccione dos opciones):",
  o:["Get-response","Get-bulk-request","Get-table","Content-type","Get-record","SNMP-trap","Domain Name System","Set-request"], c:[0,5],
  why:"El agente responde con Get-response y avisa de problemas por su cuenta con SNMP-trap. Los Get/Set-request los envía la NMS.",
  src:"Filmina 3-04 · Mensajes SNMP" },
{ b:"app", q:"Cuáles de los siguientes mensajes envía la estación administradora de red (seleccione tres opciones):",
  o:["SNMP-trap","Domain Name System","Get-bulk-request","Get-table","Content-type","Set-request","Get-request","Get-record"], c:[2,5,6],
  why:"La NMS pide valores (Get-request), tablas grandes (Get-bulk-request) y modifica variables (Set-request). El trap lo envía el agente. Get-table y Get-record no existen.",
  src:"Filmina 3-04 · Mensajes SNMP" },
{ b:"app", q:"El mensaje SNMP-trap utilizado en la gestión de red por el protocolo SNMP es enviado por:",
  o:["La estación administradora para solicitar el valor de una variable","La estación administradora para modificar el valor de una variable","El servidor para informar de un error en la base de datos","La NMS para solicitar la MIB local completa del dispositivo","El agente del dispositivo para informar sobre algún inconveniente o error"], c:[4],
  why:"El trap es el único mensaje que el agente envía sin que se lo pidan, para informar una interrupción o error en el dispositivo.",
  src:"Filmina 3-04 · Mensajes SNMP" },
{ b:"app", q:"El mensaje Get-bulk-request utilizado en la gestión de red por el protocolo SNMP es enviado por:",
  o:["La NMS para solicitar una tabla completa del dispositivo","La estación administradora para solicitar el valor de una variable","El servidor para solicitar todos los registros de recursos de la base de datos","El agente del dispositivo para informar sobre algún inconveniente o error","La estación administradora para modificar el valor de una variable"], c:[0],
  why:"Get-bulk-request “obtiene una tabla grande”: lo usa la NMS para traer muchas variables de una vez. Una sola variable es Get-request, modificar es Set-request y el error es el trap.",
  src:"Filmina 3-04 · Mensajes SNMP" },
{ b:"app", q:"¿Quién emite un mensaje SetRequest en SNMP?",
  o:["Estación gestora.","Agente.","Estación del cliente.","Ninguna de las opciones.","Un dispositivo de interconexión."], c:[0],
  why:"Set-request actualiza una o más variables del dispositivo y lo envía la estación gestora (NMS), que es donde reside la inteligencia de la gestión.",
  src:"Filmina 3-04 · Mensajes SNMP" },
{ b:"app", q:"Cuáles de las siguientes operaciones ejecuta una estación de administración de red (NMS) (seleccione dos opciones):",
  o:["Solicita la traducción de un dominio a dirección IP","Analiza el URL para ubicar el recurso solicitado","Solicita el valor de una o varias variables de estado","Comparte información entre las estaciones administradoras de red","Responde con los registros de recursos DNS","Informa de los problemas a través de un mensaje SNMP-trap"], c:[2,3],
  why:"La NMS pide valores de variables (Get-request) y se comunica con otras NMS con Inform-request (mensaje entre administradores). Informar problemas con trap es tarea del agente.",
  src:"Filmina 3-04 · Mensajes SNMP" },
{ b:"app", q:"Cuál de los siguientes comandos permite cargar datos en un formulario de un servidor Web:",
  o:["PUT","GET","HEAD","DELETE","POST","LINK"], c:[4],
  why:"POST envía datos al servidor para que los procese, como un formulario. GET pide una página, HEAD solo el encabezado y PUT sube o reemplaza un recurso completo.",
  src:"Filmina 3-04 · Métodos HTTP" },
{ b:"app", q:"Cuáles de las siguientes características pertenecen al protocolo HTTP (seleccione dos opciones):",
  o:["Protocolo sin estado","Utilizado para el intercambio de recursos en Internet","Utiliza sólo conexiones persistentes","Corre sobre el protocolo UDP","Protocolo perteneciente a la capa de transporte","Permite el intercambio de mensajes entre servidores de correo electrónico"], c:[0,1],
  why:"HTTP es de capa de aplicación, corre sobre TCP 80 y sirve para intercambiar recursos web. Es sin estado: no guarda información de conexiones anteriores (para eso están las cookies). Puede usar conexiones persistentes y no persistentes.",
  src:"Filmina 3-04 · HTTP" },
{ b:"app", q:"Cuáles de las siguientes características pertenecen al protocolo HTTPS (seleccione dos opciones):",
  o:["Corre sobre el protocolo TCP puerto 80","Protocolo perteneciente a la capa de transporte","Utiliza sólo conexiones persistentes","Utilizado para el intercambio de recursos en Internet en forma segura","Permite el intercambio de mensajes entre servidores de correo electrónico","Corre sobre el protocolo TCP en el puerto 443"], c:[3,5],
  why:"HTTPS es HTTP sobre TLS/SSL: intercambio de recursos web en forma segura, por TCP 443. El 80 es HTTP sin cifrar.",
  src:"Resumen · 6. SSL/TLS (HTTPS)" },
{ b:"app", q:"HTTP es un protocolo cliente/servidor orientado a:",
  o:["Transacciones.","Ninguna de las opciones.","Conexión.","Servicios."], c:[0],
  why:"HTTP funciona por transacciones solicitud–respuesta: el cliente envía un pedido y el servidor responde, sin guardar estado. La conexión la pone TCP, no HTTP.",
  src:"Filmina 3-04 · HTTP" },
{ b:"app", q:"Cuál de las siguientes afirmaciones es correcta con respecto a las páginas de un servidor Web:",
  o:["Poseen un URL único y diferente","Deben ser dinámicas","Tienen la misma cantidad de objetos","Comparten el mismo URL"], c:[0],
  why:"Cada página (y cada objeto) se identifica con su propio URL (protocolo + servidor + ruta). Pueden ser estáticas o dinámicas y tener distinta cantidad de objetos.",
  src:"Filmina 3-04 · HTTP / Tanenbaum 7.3" },
{ b:"app", q:"¿De qué lado encontramos el proxy en HTTP?",
  o:["Ninguna de las opciones.","Del agente usuario.","Del servidor origen.","No hay proxy en HTTP.","Del cliente."], c:[4],
  why:"El proxy (representante) es un intermediario del lado del cliente: recibe los pedidos de los navegadores de la organización, los reenvía y guarda en caché las respuestas.",
  src:"Filmina 3-04 · HTTP (intermediarios)" },
{ b:"app", q:"Si el cliente y el servidor ejecutan diferentes versiones de HTTP, ¿quién puede implementar ambas versiones y realizar las traducciones necesarias?",
  o:["Servidor origen.","Representante.","Ninguna de las opciones.","Cliente.","Pasarela.","Túnel."], c:[4],
  why:"La pasarela (gateway) actúa como intermediario que recibe en un protocolo o versión y traduce a otro. El túnel solo retransmite sin interpretar, y el representante (proxy) reenvía y cachea.",
  src:"Filmina 3-04 · HTTP (intermediarios)" },

// ======================= 5. SEGURIDAD =======================
{ b:"seg", q:"¿Cuáles de las siguientes son características relacionadas a las políticas de seguridad de una red? (Seleccione tres opciones)",
  o:["Se definen las restricciones y reglas de acceso a los recursos de una organización","Se adaptan a las necesidades de seguridad de una empresa en particular","Se definen en un documento que se actualiza constantemente","Todas las empresas deben aplicar las mismas políticas de seguridad","El administrador de red define las políticas de seguridad de una empresa","Se establecen una única vez cuando se diseña e instala la red"], c:[0,1,2],
  why:"La política de seguridad es un documento vivo que define reglas de acceso a los recursos y se adapta a cada empresa. No es igual para todas, no se define una sola vez, y la decide la organización (no solo el administrador).",
  src:"Resumen · 6. Políticas de seguridad" },
{ b:"seg", q:"El documento que establece las reglas y comportamientos de los miembros de una empresa y determina cómo se puede acceder a los recursos y quién puede acceder a qué recursos, hace referencia a:",
  o:["Confidencialidad","Autenticación","Firma digital","Listas de control de acceso","Inventario de recursos","Firewall","Políticas de seguridad"], c:[6],
  why:"Esa es la definición de política de seguridad. Las ACL y el firewall son herramientas para implementarla.",
  src:"Resumen · 6. Políticas de seguridad" },
{ b:"seg", q:"El dueño de una empresa tiene una reunión con el administrador de seguridad y le hace hincapié en la relación costo-beneficio. ¿A qué aspecto a tener en cuenta en el desarrollo de las políticas de seguridad nos referimos?",
  o:["Identificación de amenazas.","Ninguna de las opciones.","Análisis de riesgo.","Operaciones de seguridad."], c:[2],
  why:"El análisis de riesgo compara cuánto cuesta proteger un recurso contra cuánto se perdería si se compromete (costo-beneficio). No tiene sentido gastar más en protegerlo de lo que vale.",
  src:"Resumen · 6. Políticas de seguridad" },
{ b:"seg", q:"El administrador de red, en sus procesos habituales de control, encontró un ataque de confidencialidad, que atenta contra un requisito de una comunicación segura. ¿A qué tipo de amenazas a la seguridad nos referimos?",
  o:["Retransmisión de datos.","Denegación de servicio.","Interceptación.","Modificación.","Ninguna de las opciones."], c:[2],
  why:"Interceptación es cuando un tercero accede a la información (ataque a la confidencialidad). Modificación ataca la integridad y la denegación de servicio ataca la disponibilidad.",
  src:"Resumen · 6. Amenazas" },
{ b:"seg", q:"Cuáles de las siguientes forman parte de la triple A, seleccione varias opciones:",
  o:["Alertas","Autenticación","Auténtico","Ambientación","Asistencia","Auditoría","Accesos","Autorización"], c:[1,5,7],
  why:"AAA = Autenticación (quién sos), Autorización (qué podés hacer) y Auditoría/Accounting (registro de lo que hiciste).",
  src:"Resumen · 6. Seguridad (AAA)" },
{ b:"seg", q:"¿Cuál de las siguientes opciones es un tipo de sistema criptográfico según la forma de procesar el texto plano?",
  o:["Ninguna de las opciones.","Transportación.","Cifrado de bloques.","Sustitución.","Transposición."], c:[2],
  why:"Según cómo procesa el texto plano, un sistema es de cifrado de bloques o de flujo. Sustitución y transposición son según el tipo de operación usada.",
  src:"Resumen · 6. Criptografía (clasificación)" },
{ b:"seg", q:"¿En qué tipo de sistema criptográfico el emisor y el receptor utilizan la misma clave?",
  o:["Clave asimétrica.","Clave privada.","Clave pública.","Ninguna de las opciones."], c:[1],
  why:"Clave simétrica = clave privada (secreta): la misma clave cifra y descifra. Clave pública = asimétrica, con un par pública/privada.",
  src:"Resumen · 6. Criptografía simétrica" },
{ b:"seg", q:"¿Cómo son las claves de dos usuarios que se comunican por un sistema de clave simétrica?",
  o:["Cada uno tiene su clave personal y se mantienen en secreto.","Ninguna de las opciones.","Las claves son iguales y se mantienen en secreto.","Cada uno tiene su clave personal y no hace falta mantenerlas en secreto.","Las claves son iguales y no hace falta mantenerlas en secreto."], c:[2],
  why:"En el cifrado simétrico ambos comparten la misma clave, y debe mantenerse secreta: quien la tenga puede descifrar todo. El problema es cómo distribuirla.",
  src:"Resumen · 6. Criptografía simétrica" },
{ b:"seg", q:"¿Cómo son las claves de Alicia y Benito que se comunican por un sistema de clave pública?",
  o:["Una de las claves es pública y la otra clave sólo es conocida por Benito o por Alicia, pero no por ambos.","Sólo Alicia y Benito conocen las claves, porque la comunicación es entre ellos.","Ninguna de las opciones.","Como el sistema es de clave pública, todos conocen las claves."], c:[0],
  why:"Cada uno tiene un par: la pública la conoce todo el mundo y la privada solo su dueño. La privada de Alicia no la conoce Benito, y al revés.",
  src:"Resumen · 6. Criptografía de clave pública" },
{ b:"seg", q:"Si se desea garantizar “confidencialidad” en una comunicación en la cual el origen es Ana y el destino es Pedro, se debe:",
  o:["Cifrar con la clave pública de Pedro y descifrar con la clave privada de Pedro","Cifrar con la clave pública de Ana y descifrar con la clave privada de Ana","Cifrar con la clave privada de Pedro y descifrar con la clave pública de Pedro","Cifrar con la clave privada de Ana y descifrar con la clave pública de Ana"], c:[0],
  why:"Para que solo Pedro pueda leerlo, Ana cifra con la pública de Pedro y solo él lo descifra con su privada. Cifrar con la privada de Ana sirve para autenticar (firma), no da confidencialidad.",
  src:"Resumen · 6. Criptografía de clave pública" },
{ b:"seg", q:"¿Cuál de las siguientes opciones corresponde a un KDC?",
  o:["Genera una clave simétrica de sesión entre dos partes que se utiliza sólo una vez.","Ninguna de las opciones.","Otorga certificados a los usuarios que realizan la comunicación.","Controla el tráfico entre dos entidades registradas en el KDC.","Genera claves asimétricas permanentes entre dos partes."], c:[0],
  why:"El KDC comparte una clave con cada usuario y genera una clave de sesión simétrica (R1) para que dos usuarios se comuniquen, válida una sola vez. Otorgar certificados es tarea de la CA.",
  src:"Resumen · 6. KDC" },
{ b:"seg", q:"Cuáles de los siguientes permiten garantizar “autenticación” e “integridad”? (Seleccione dos opciones).",
  o:["DES","MD5","KDC","SHA-2","TCP","Clave simétrica","Firewall","IDEA"], c:[2,5],
  why:"Las firmas digitales de clave simétrica usan un intermediario de confianza (KDC) que comparte una clave simétrica con cada usuario: así verifica quién lo envió y que el mensaje no se alteró. Esta es la respuesta del FORMS.",
  src:"Resumen · 6. Firmas digitales de clave simétrica" },
{ b:"seg", q:"¿Cómo se puede minimizar el problema de que un tercero pueda reproducir el mensaje entre el origen y destino cuando se aplican firmas digitales de clave simétrica?",
  o:["No hay problema porque la transmisión está encriptada.","Ninguna de las opciones.","En todos los intercambios se usan estampa de tiempo.","Se verifica periódicamente la clave del emisor y del receptor.","El protocolo TCP se encarga de evitar la retransmisión."], c:[2],
  why:"Contra el ataque de repetición (replay) se agrega una estampa de tiempo (y un número aleatorio) en cada mensaje. Así el receptor descarta los mensajes viejos o repetidos.",
  src:"Resumen · 6. Firmas digitales de clave simétrica" },
{ b:"seg", q:"Juan y Pedro van a comunicarse por temas laborales y van a utilizar hash criptográficos. ¿Qué necesitan verificar?",
  o:["Ninguna de las opciones.","Autenticación y la disponibilidad.","La confidencialidad y la autenticación.","Integridad de los datos y la autenticación.","Integridad de los datos y la disponibilidad."], c:[3],
  why:"El hash (resumen de mensaje) firmado verifica que el mensaje no cambió (integridad) y quién lo envió (autenticación). No cifra el mensaje, así que no da confidencialidad.",
  src:"Resumen · 6. Resumen de mensajes (hash)" },
{ b:"seg", q:"¿Cómo queda vinculado el autor del mensaje cuando utilizamos resumen de mensajes (hash) en las firmas digitales?",
  o:["Utiliza su propia clave privada y la pública del destino.","Utiliza su propia clave privada.","Utiliza la clave privada del destino.","Ninguna de las opciones.","Utiliza su propia clave pública y la privada del destino."], c:[1],
  why:"El autor cifra el hash con su propia clave privada. Cualquiera lo verifica con la pública del autor, y como solo él tiene esa privada, queda vinculado al mensaje.",
  src:"Resumen · 6. Resumen de mensajes (hash)" },
{ b:"seg", q:"¿Qué responsabilidad tiene una CA?",
  o:["Ninguna de las opciones.","Controlar la comunicación y emitir certificados.","Validar identidades y emitir certificados","Utilizar la criptografía de clave privada.","Validar identidades y enviar claves a los destinatarios."], c:[2],
  why:"La Autoridad de Certificación valida la identidad de una entidad y emite un certificado que vincula esa identidad con su clave pública. No controla la comunicación ni reparte claves.",
  src:"Resumen · 6. Autoridades de certificación" },
{ b:"seg", q:"Cuáles de las siguientes características describen a las Autoridades de Certificación, seleccione tres opciones:",
  o:["Distribuye claves simétricas que serán utilizadas sólo durante una sesión","Valida cada paquete que se envía entre dos entidades certificadas","Valida identidades y emite certificados","El certificado contiene la clave pública de una identidad e información adicional","La autoridad de certificación firma el certificado con su clave pública","El certificado contiene las claves públicas y privadas de una entidad, además de información adicional","El certificado es firmado digitalmente con la clave privada de la autoridad de certificación"], c:[2,3,6],
  why:"La CA valida identidades y emite certificados con la clave pública de la entidad (nunca la privada), firmados con la clave privada de la CA. Las claves de sesión las distribuye el KDC.",

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador · Parcial 1 · Redes de Datos</title>
<meta name="description" content="Cuestionario interactivo para practicar el primer parcial de Redes de Datos (4K4).">
<meta name="theme-color" content="#C8102E">
<style>
:root{
  --rojo:#C8102E; --rojo-osc:#9E0B22; --rojo-claro:#FDECEF; --rojo-borde:#e3c4ca;
  --tinta:#1d1d1f; --gris:#6b6b70; --linea:#ececec; --fondo:#fbf7f7;
  --ok:#1f8a4c; --ok-claro:#e8f6ee; --mal:#C8102E; --mal-claro:#fdecef;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;color:var(--tinta);background:var(--fondo);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
/* ---------- header ---------- */
header{background:var(--rojo);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(158,11,34,.25)}
.hwrap{max-width:1040px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.15;cursor:pointer}
.brand small{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.brand b{font-size:20px}
nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
nav button{background:transparent;border:0;color:#fff;padding:8px 14px;border-radius:999px;font-weight:600;opacity:.9}
nav button:hover{background:rgba(255,255,255,.14);opacity:1}
nav button.on{background:#fff;color:var(--rojo);opacity:1}
main{max-width:1040px;margin:0 auto;padding:26px 20px 60px}
footer{text-align:center;color:var(--gris);font-size:13px;padding:0 20px 30px}
/* ---------- comunes ---------- */
h1.tit{font-size:28px;margin:0 0 4px;color:var(--rojo-osc)}
.lead{color:var(--gris);margin:0 0 22px}
.btn{border:2px solid var(--rojo);background:var(--rojo);color:#fff;padding:10px 18px;border-radius:10px;font-weight:700;transition:.15s}
.btn:hover{background:var(--rojo-osc);border-color:var(--rojo-osc)}
.btn.sec{background:#fff;color:var(--rojo)}
.btn.sec:hover{background:var(--rojo-claro)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.card{background:#fff;border:1px solid var(--linea);border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.tag{display:inline-block;background:var(--rojo-claro);color:var(--rojo-osc);font-weight:700;font-size:12px;padding:3px 10px;border-radius:999px;letter-spacing:.02em}
.bar{height:8px;background:#f1e3e5;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--rojo);border-radius:99px;transition:width .3s}
/* ---------- inicio ---------- */
.hero{padding:26px;margin-bottom:22px;background:linear-gradient(135deg,#fff 0%,#fff 60%,var(--rojo-claro) 100%);border-left:6px solid var(--rojo)}
.hero .acc{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.opts{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;color:var(--gris);font-size:14px}
.opts label{display:flex;align-items:center;gap:6px;cursor:pointer}
.opts input{accent-color:var(--rojo)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.bloque{padding:20px;display:flex;flex-direction:column;gap:10px;transition:.15s;border-top:4px solid var(--rojo)}
.bloque:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(158,11,34,.12)}
.bloque .num{width:34px;height:34px;border-radius:10px;background:var(--rojo);color:#fff;display:grid;place-items:center;font-weight:800}
.bloque h3{margin:0;font-size:18px}
.bloque p{margin:0;color:var(--gris);font-size:14px}
.bloque .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--gris)}
.bloque .row{display:flex;gap:8px;margin-top:auto;padding-top:4px}
.bloque .row .btn{flex:1;padding:8px 10px;font-size:14px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:16px;padding-top:16px;border-top:1px solid var(--linea)}
.sel-tema{flex:1;min-width:240px;padding:10px 12px;border:2px solid var(--rojo-borde);border-radius:10px;font:inherit;font-weight:600;color:var(--rojo-osc);background:#fff;cursor:pointer}
.sel-tema:focus{outline:none;border-color:var(--rojo)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.mix{display:flex;gap:6px;flex-wrap:wrap}
.mix span{font-size:12px;background:var(--rojo-claro);color:var(--rojo-osc);padding:2px 8px;border-radius:99px;font-weight:600}
.aviso{background:#fff7e6;border:1px solid #f1d39a;border-radius:10px;padding:10px 14px;margin:0 0 14px}
.grid-q{border-collapse:collapse;width:100%;max-width:520px}
.grid-q td{padding:7px 10px;border-bottom:1px solid var(--linea)}
.grid-q .gf{font-weight:650;width:40%}
.grid-q select{font:inherit;padding:6px 8px;border:2px solid var(--rojo-borde);border-radius:8px;min-width:110px}
.grid-q tr.good td{background:var(--ok-claro)} .grid-q tr.bad td{background:var(--mal-claro)}
.grid-q .gc{color:var(--ok);font-weight:700}
/* ---------- quiz ---------- */
.qtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.qtop .cont{margin-left:auto;font-size:14px;color:var(--gris);font-weight:600}
.qtop .score{font-size:14px;font-weight:700;color:var(--ok)}
.qtop .score b{color:var(--mal);margin-left:8px}
.qcard{padding:26px;margin-top:14px}
.qtext{font-size:19px;font-weight:650;margin:0 0 6px}
.hint{font-size:13px;color:var(--rojo);font-weight:700;margin-bottom:14px}
.qimg{margin:6px 0 16px;text-align:center}
.qimg img{max-width:100%;border:1px solid var(--linea);border-radius:10px;cursor:zoom-in}
.olist{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:2px solid var(--linea);border-radius:12px;background:#fff;cursor:pointer;text-align:left;transition:.12s;width:100%}
.opt:hover{border-color:var(--rojo-borde);background:#fffafa}
.opt .mk{flex:none;width:22px;height:22px;border:2px solid #c9c9cf;margin-top:1px;display:grid;place-items:center;font-size:13px;color:#fff;font-weight:800}
.opt.radio .mk{border-radius:50%}
.opt.check .mk{border-radius:6px}
.opt .k{flex:none;font-size:12px;color:var(--gris);margin-top:3px;min-width:14px}
.opt.sel{border-color:var(--rojo);background:var(--rojo-claro)}
.opt.sel .mk{border-color:var(--rojo);background:var(--rojo)}
.opt.sel.radio .mk::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.opt.sel.check .mk::after{content:"✓"}
.opt.lock{cursor:default}
.opt.lock:hover{background:#fff;border-color:var(--linea)}
.opt.good{border-color:var(--ok)!important;background:var(--ok-claro)!important}
.opt.good .mk{border-color:var(--ok);background:var(--ok)}
.opt.good .mk::after{content:"✓"!important;width:auto!important;height:auto!important;background:none!important}
.opt.bad{border-color:var(--mal)!important;background:var(--mal-claro)!important}
.opt.bad .mk{border-color:var(--mal);background:var(--mal)}
.opt.bad .mk::after{content:"✕"!important;width:auto!important;height:auto!important;background:none!important}
.opt.miss{border-style:dashed!important;border-color:var(--ok)!important}
.opt.miss .mk{background:#fff;border-color:var(--ok)}
.opt.miss .mk::after{content:""!important}
.opt.miss::after{content:"correcta";margin-left:auto;font-size:12px;font-weight:700;color:var(--ok);align-self:center}
.qact{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.fb{margin-top:18px;border-radius:12px;padding:16px 18px;border-left:6px solid}
.fb.ok{background:var(--ok-claro);border-color:var(--ok)}
.fb.no{background:var(--mal-claro);border-color:var(--mal)}
.fb h4{margin:0 0 6px;font-size:17px}
.fb.ok h4{color:var(--ok)} .fb.no h4{color:var(--mal)}
.fb .ans{font-size:14px;margin:0 0 8px}
.fb .why{margin:0}
.fb .src{margin-top:8px;font-size:12.5px;color:var(--gris)}
.fb .src::before{content:"📖 "}
.nota{margin-top:10px;font-size:13.5px;background:#fff7e6;border:1px solid #f1d39a;border-radius:8px;padding:8px 10px}
.nota b{color:#9a6200}
/* ---------- resultados ---------- */
.res{padding:28px;text-align:center}
.big{font-size:64px;font-weight:800;color:var(--rojo);line-height:1}
.big small{font-size:24px;color:var(--gris)}
.res .acc{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.rev{margin-top:20px;display:flex;flex-direction:column;gap:12px}
.ritem{padding:16px 18px;border-left:5px solid var(--linea)}
.ritem.ok{border-left-color:var(--ok)} .ritem.no{border-left-color:var(--mal)}
.ritem .rq{font-weight:650;margin:6px 0}
.ritem ul{margin:6px 0 0;padding-left:20px}
.ritem li.c{color:var(--ok);font-weight:650}
.ritem li.x{color:var(--mal);text-decoration:line-through}
.ritem .why{color:#333;font-size:14.5px;margin-top:8px}
.ritem .src{font-size:12.5px;color:var(--gris);margin-top:4px}
.ritem img{max-width:100%;border:1px solid var(--linea);border-radius:8px;margin-top:6px}
/* ---------- repaso ---------- */
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.chip{cursor:pointer;border:2px solid var(--rojo-borde);background:#fff;color:var(--rojo-osc);padding:6px 12px;border-radius:999px;font-weight:600;font-size:14px}
.chip.on{background:var(--rojo);border-color:var(--rojo);color:#fff}
.buscar{flex:1;min-width:200px;padding:9px 12px;border:2px solid var(--linea);border-radius:10px;font:inherit}
.buscar:focus{outline:none;border-color:var(--rojo)}
/* ---------- stats ---------- */
table.st{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden}
table.st th{background:var(--rojo);color:#fff;text-align:left;padding:10px 14px;font-size:14px}
table.st td{padding:10px 14px;border-bottom:1px solid var(--linea)}
table.st tr:last-child td{border-bottom:0;font-weight:700;background:var(--rojo-claro)}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;place-items:center;z-index:50;cursor:zoom-out;padding:20px}
.zoom img{max-width:100%;max-height:100%;background:#fff;border-radius:8px}
.zoom.on{display:grid}
/* contexto de preguntas simuladas (tablas, salidas, figuras) */
.ctx{--code:#f6f4f4;--line:#e8dfe0;--muted:#6b6b70;--ink:#1d1d1f;--card:#fff;margin:4px 0 12px;overflow-x:auto}
.ctx pre.out{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:auto;white-space:pre;margin:6px 0 12px}
.ctx table.t{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 12px}
.ctx table.t td,.ctx table.t th{border:1px solid var(--line);padding:6px 8px;text-align:left}
.ctx table.t th{background:var(--rojo-claro);color:var(--rojo-osc)}
.ctx .fw{width:100%;border-collapse:separate;border-spacing:0 4px;font-size:14px;margin:6px 0 12px}
.ctx .fw td{padding:7px 8px;background:var(--code)}
.ctx .fw td:first-child{border-radius:6px 0 0 6px;color:#fff;font-weight:700;text-align:center;width:34px}
.ctx .fw td:last-child{border-radius:0 6px 6px 0}
.ctx .fw .g{background:#2e7d4f} .ctx .fw .r{background:#c0392b} .ctx .fw .k{background:#111}
.ctx .fw .z{background:#e5f4e9;color:#1d5e36;border-radius:4px;padding:1px 6px}
.ctx .fw .zr{background:#fbebea;color:#8c2a22;border-radius:4px;padding:1px 6px}
.ctx .fw .cm{display:block;font-size:12px;color:var(--muted)}
.ctx .legend{font-size:13px;color:var(--muted)}
.ctx .fig{margin:8px 0 4px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 12px 6px}
.ctx .fig figcaption{font-size:13.5px;color:var(--muted);text-align:center;margin:4px 0 2px}
.ctx .fig svg{max-width:100%;height:auto} .ctx .fig img{max-width:100%;cursor:zoom-in}
.sv .bx{stroke-width:1} .sv .tx{font-size:13px} .sv .tsm{font-size:11px} .sv .tb{font-weight:600}
.sv .tl{font-size:12.5px;fill:var(--muted)} .sv .tbl{font-weight:600;fill:var(--ink)}
.sv .ar,.sv .ar2{stroke:var(--muted);stroke-width:1.5} .sv .lk{stroke:var(--muted);stroke-width:1.3}
.sv .lkx{stroke:#E24B4A;stroke-width:2;stroke-dasharray:6 4} .sv .lf{stroke:var(--line);stroke-width:1.2;stroke-dasharray:4 4}
.sv .tn{stroke:#1D9E75;stroke-width:7;stroke-linecap:round;opacity:.6} .sv .ax{stroke:var(--muted);stroke-width:1}
.sv .ln{stroke:#378ADD;stroke-width:2.2} .sv .dt{fill:#378ADD}
.sv .bx.bl{fill:#e6f1fb;stroke:#378ADD} .sv .tx.bl{fill:#0C447C}
.sv .bx.pu{fill:#eeedfe;stroke:#7F77DD} .sv .tx.pu{fill:#3C3489}
.sv .bx.te{fill:#e1f5ee;stroke:#1D9E75} .sv .tx.te{fill:#085041}
.sv .bx.am{fill:#faeeda;stroke:#BA7517} .sv .tx.am{fill:#633806}
.sv .bx.co{fill:#faece7;stroke:#D85A30} .sv .tx.co{fill:#712B13}
.sv .bx.gy{fill:#f1efe8;stroke:#888780} .sv .tx.gy{fill:#444441}
.fb details{margin-top:10px;font-size:14.5px} .fb summary{cursor:pointer;font-weight:700;color:var(--rojo-osc)}
.fb details ol{margin:6px 0 0;padding-left:20px} .fb details li{margin:3px 0}
.tag.k1{background:#fff2d6;color:#8a5a0b}
.aviso-sim{background:#fff7e6;border:1px solid #f1d39a;border-radius:10px;padding:10px 14px;font-size:14px;margin-top:14px}
.ritem .ctx{max-width:640px}
.seg{display:inline-flex;background:var(--rojo-claro);border-radius:999px;padding:4px;gap:4px;margin:0 0 14px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--rojo-osc);font-weight:700;padding:9px 18px;border-radius:999px;font-size:15px;cursor:pointer}
.seg button.on{background:var(--rojo);color:#fff}
.seg small{opacity:.75;font-weight:600;margin-left:4px}
.ritem .fb summary{font-size:14px}
@media (max-width:640px){
  .qcard{padding:18px} .qtext{font-size:17px} h1.tit{font-size:23px} .hwrap{padding:10px 14px} nav button{padding:6px 10px;font-size:14px}
}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="brand" onclick="ir('inicio')"><small>Redes de Datos · 4K4</small><b>Simulador · Parcial 1</b></div>
  <nav id="nav">
    <button data-v="inicio">Inicio</button>
    
    <button data-v="simulacro">Simulacro</button>
    <button data-v="repaso">Repaso</button>
    <button data-v="stats">Estadísticas</button>
  </nav>
</div></header>
<main id="app"></main>
<footer>Preguntas del Moodle del 1er parcial teórico 4K4, de la revisión en clase del 1er parcial y del preguntero del zip · Alcance: filminas 1-01 a 1-11 · El bloque Extra (IPv6/ARP/DHCP/ICMP) seguramente no entra</footer>
<div class="zoom" id="zoom" onclick="this.classList.remove('on')"><img id="zoomimg" alt=""></div>

<script>
// Banco de preguntas del Parcial 1 (Redes de Datos 4K4).
// Fuentes: Moodle "1er Parcial Teórico 4K4" (18/08/2020, varias revisiones con la respuesta correcta),
// revisión en clase del 1er parcial teórico (capturas, 2020/2021), y el preguntero "Primer parcial" del zip.
// Alcance 2026: filminas 1-01 a 1-11 (Unidad 1, Unidad 2 y Unidad 3 hasta VLANs, CIDR y VLSM).
// c = índices (base 0) de las opciones correctas. filas = pregunta de unir (grid).

const BLOQUES = [
  { id: "u1", n: 1, titulo: "Redes, arquitectura e Internet", sub: "Clasificación, capas, TCP/IP, encapsulamiento, Internet y organismos" },
  { id: "u2", n: 2, titulo: "Acceso al medio, dispositivos y WLAN", sub: "CSMA/CD, CSMA/CA, Ethernet, hub, switch, STP, 802.11" },
  { id: "u3", n: 3, titulo: "IPv4, subredes y VLANs", sub: "Clases, máscaras, subnetting, privadas, CIDR, VLSM, 802.1Q" },
  { id: "x",  n: 4, titulo: "Extra: IPv6, ARP, DHCP, ICMP", sub: "Salían en el parcial 2020; según las filminas 2026 seguramente NO entran" }
];

const PREGUNTAS = [
// ======================= 1. REDES, ARQUITECTURA E INTERNET =======================
{ b:"u1", q:"Ordene de menor a mayor la cobertura de las redes:",
  o:["LAN, PAN, MAN, WAN e Internet","PAN, LAN, MAN, WAN e Internet","PAN, MAN, LAN, WAN e Internet","LAN, MAN, PAN, WAN e Internet"], c:[1],
  why:"PAN (metros, Bluetooth) < LAN (edificio/campus) < MAN (ciudad) < WAN (país/continente) < Internet (red de redes).",
  src:"Preguntero 1er parcial (zip)" },
{ b:"u1", q:"¿Cuál de las siguientes clasificaciones de redes es decreciente con respecto al área de cobertura?",
  o:["WAN - SAN - MAN - LAN","LAN - MAN - WAN - PAN","MAN - WAN - LAN - PAN","PAN - LAN - MAN - WAN","WAN - MAN - LAN - PAN"], c:[4],
  why:"Decreciente = de mayor a menor: WAN > MAN > LAN > PAN. Ojo con la palabra 'decreciente', la opción PAN-LAN-MAN-WAN es la creciente.",
  src:"Revisión en clase del 1er parcial" },
{ b:"u1", q:"Cuando utilizamos la conexión vía Bluetooth, ¿de qué tipo de red estamos hablando?",
  o:["LAN","MAN","PAN","WAN"], c:[2],
  why:"Bluetooth (IEEE 802.15) conecta dispositivos a pocos metros de una persona: red de área personal (PAN).",
  src:"Preguntero 1er parcial (zip)" },
{ b:"u1", q:"La red del campus de la UTN Facultad Regional Córdoba es una red MAN.",
  o:["Verdadero","Falso"], c:[1],
  why:"Un campus (edificios cercanos de una misma organización) es una LAN. Una MAN cubre una ciudad.",
  src:"Moodle 1er Parcial 4K4 (2020)" },
{ b:"u1", q:"¿Dónde encontraríamos las redes por el cableado eléctrico?",
  o:["PAN","WAN","MAN","LAN"], c:[3],
  why:"Las redes por línea eléctrica (PLC/powerline) se usan dentro de una casa u oficina: son LAN (Tanenbaum las nombra entre las redes domésticas).",
  src:"Preguntero 1er parcial (zip)" },
{ b:"u1", q:"Cuando utilizamos las redes de computadoras, encontramos distintos tipos de usos o aplicaciones para las mismas (elija dos):",
  o:["Usuarios fijos","Aplicaciones de negocios","Redes de conmutación","Usuarios móviles","Aplicaciones domésticas"], c:[1,4],
  why:"Tanenbaum y la filmina 1-01 clasifican los usos en aplicaciones de negocios y aplicaciones domésticas (además de usuarios móviles). El preguntero marcó negocios + domésticas.",
  nota:"El preguntero del zip anotó 'Usuarios fijos' y 'Aplicaciones de negocios'. Según la filmina, los usos son negocios, domésticos y usuarios móviles; 'usuarios fijos' no figura. Si te aparece, priorizá negocios y domésticas.",
  src:"Preguntero 1er parcial (zip) / Filmina 1-01" },
{ b:"u1", q:"Al trabajar en aplicaciones de negocios (o domésticas), encontramos un modelo en el que interactúan los dispositivos. ¿Cómo llamamos a este modelo?",
  o:["Peer to peer","Cliente-Servidor","Maestro-Esclavo","Punto a punto"], c:[1],
  why:"El modelo cliente-servidor es el que más se usa: el cliente pide y el servidor responde. En el preguntero salió tanto para negocios como para domésticas, con la misma respuesta.",
  src:"Preguntero 1er parcial (zip)" },
{ b:"u1", q:"Hardware de la red. En el diseño de una red, ¿cuáles son los dos tipos de tecnología de transmisión que se utilizan mucho en la actualidad? (elija dos)",
  o:["Conmutación de circuitos","Punto a punto","Difusión (broadcast)","Multiplexación","Token passing"], c:[1,2],
  why:"Tanenbaum: hay dos tipos de tecnología de transmisión, enlaces punto a punto y enlaces de difusión (broadcast).",
  src:"Preguntero 1er parcial (zip)" },
{ b:"u1", q:"Si tuviera que elegir un tipo de red que le brindara garantía de entrega de los mensajes sin demora (en tiempo real), en orden y con un ancho de banda constante, elegiría:",
  o:["Red conmutada por etiquetas","Red por difusión","Red conmutada por circuitos","Red conmutada por paquetes","Red conmutada por mensajes"], c:[2],
  why:"En conmutación de circuitos se reserva un camino dedicado antes de transmitir: ancho de banda constante, sin demora variable y todo llega en orden. Paquetes no garantiza nada de eso.",
  src:"Moodle 1er Parcial 4K4 (2020)" },
{ b:"u1", q:"La ARPANET estaba montada sobre una red de:",
  o:["Conmutación de celdas","Conmutación de circuitos","Conmutación de paquetes","Retransmisión de tramas (frame relay)"], c:[2],
  why:"ARPANET (DoD, 1969) se diseñó con conmutación de paquetes para que fuera tolerante a fallas: si cae un nodo, los paquetes toman otro camino.",
  src:"Moodle 1er Parcial 4K4 (2020)" },
{ b:"u1", q:"Si hablamos de Internet, podemos decir que es una red: [ ___ ], [ ___ ], que posee una [ ___ ] y está basada en [ ___ ]. Elegí las 4 que completan la frase:",

{ b:"u1", q:"Indique la secuencia correcta de las PDU en el equipo origen de una transmisión:",

{ b:"u1", q:"Las tecnologías Ethernet, Fast Ethernet y Gigabit Ethernet ejecutan funciones de las siguientes capas:",

{ b:"u1", q:"Cuando se necesitaba un estándar en Internet, se discutía y luego se anunciaban los cambios formalmente. La comunicación se llevaba a cabo por informes técnicos llamados:",

{ b:"u1", q:"Los Request for Comments son:",

{ b:"u1", q:"La estandarización o normalización presenta la siguiente ventaja:",

{ b:"u1", q:"Teniendo en cuenta la arquitectura de Internet, las conexiones de TRÁNSITO se caracterizan por (seleccione tres):",
  o:["Permiten conectar operadores de diferente jerarquía","El operador de menor jerarquía debe pagar una conexión al operador de mayor jerarquía","El proveedor le da acceso al cliente sólo algunas de sus rutas","El proveedor le da acceso al cliente a todas sus rutas","Pueden ser públicas o privadas","Permiten el intercambio de tráfico sin costo entre operadores"], c:[0,1,3],
  why:"Tránsito = relación cliente-proveedor entre distinta jerarquía (Tier 3 → Tier 2 → Tier 1): el de abajo paga y recibe TODAS las rutas (acceso a todo Internet). Sin costo y 'públicas o privadas' es peering.",

{ b:"u1", q:"Teniendo en cuenta la arquitectura de Internet, las conexiones de PEERING (seleccione tres):",

{ b:"u2", q:"¿En cuál de los siguientes dispositivos se ejecuta CSMA/CD?",
  o:["Placas de red inalámbricas","Hubs","Placas de red Ethernet","Cable UTP"], c:[2],
  why:"CSMA/CD lo ejecutan las NIC Ethernet (escuchan, transmiten y detectan colisiones). El hub es un repetidor de capa 1: no ejecuta ningún algoritmo. Las inalámbricas usan CSMA/CA.",
  src:"Revisión en clase del 1er parcial" },
{ b:"u2", q:"¿Qué trama usa una estación de trabajo cuando quiere transmitir a otro puesto utilizando CSMA/CA?",
  o:["CTS","ACK","Beacon","RTS"], c:[3],
  why:"En CSMA/CA la estación primero envía RTS (Request To Send); el AP responde CTS (Clear To Send), recién ahí manda datos y espera ACK.",
  src:"Preguntero 1er parcial (zip)" },
{ b:"u2", q:"RTS en la transmisión inalámbrica es:",
  o:["Una trama de datos","Una trama de administración","Un campo de la trama 802.3","Una trama de control"], c:[3],
  why:"RTS, CTS y ACK son tramas de CONTROL de 802.11. Las de administración son beacon, asociación, autenticación, etc.",
  src:"Revisión en clase del 1er parcial" },
{ b:"u2", q:"En el método de acceso CSMA/CA, el mensaje RTS contiene:",
  o:["Números de puerto origen y destino","Relación IP – MAC del dispositivo destino","Direcciones MAC del dispositivo origen y destino (y el tiempo de transmisión)","Direcciones IP del dispositivo origen y destino"], c:[2],
  why:"RTS es una trama de capa 2: lleva MAC origen, MAC destino y la duración (tiempo) que va a ocupar el canal, para que las demás estaciones esperen (NAV).",
  src:"Revisión en clase del 1er parcial" },
{ b:"u2", q:"Una WLAN es una red (seleccione tres):",
  o:["El ancho de banda total se divide en partes iguales entre los dispositivos","WAN","Utiliza el protocolo CSMA/CA","Ofrece un ancho de banda fijo a cada host","Símplex","Full dúplex","Inalámbrica","De difusión"], c:[2,6,7],
  why:"WLAN = inalámbrica, de difusión (el medio aire es compartido) y usa CSMA/CA para acceder al medio.",
  src:"Moodle 1er Parcial 4K4 (2020)" },
{ b:"u2", q:"WiFi es una red de:",
  o:["Banda angosta, dúplex, LAN","Banda ancha, dúplex, LAN","Banda ancha, semidúplex, WAN","Banda ancha, semidúplex, LAN"], c:[3],
  why:"Wi-Fi es banda ancha, LAN y SEMIDÚPLEX (half-duplex): en un canal solo transmite uno a la vez (por eso CSMA/CA).",
  src:"Revisión en clase del 1er parcial" },
{ b:"u2", q:"Si una placa de red recibe una trama cuya MAC de ORIGEN es FF:FF:FF:FF:FF:FF:",
  o:["Difunde la trama","Procesa la trama","Descarta la trama","Encapsula la trama"], c:[2],
  why:"FF:FF:FF:FF:FF:FF es broadcast y solo puede ir como DESTINO. Como origen es inválida, la NIC descarta la trama.",
  src:"Revisión en clase del 1er parcial" },
{ b:"u2", q:"Una placa de red recibe una trama, calcula el CRC y no coincide con el valor que viene en la trama. ¿Qué hace la placa?",
  o:["Desencapsula la trama y la entrega a la capa superior","Descarta la trama","Pide retransmisión al origen","Descarta la trama e informa al origen"], c:[1],
  why:"Ethernet no es confiable: si el FCS/CRC no coincide, la NIC descarta en silencio. No avisa ni pide retransmisión (eso lo haría TCP más arriba).",
  src:"Revisión en clase del 1er parcial" },
{ b:"u2", q:"El campo de la trama Ethernet que permite verificar la integridad de la trama es:",
  o:["Ninguno porque Ethernet es no fiable","Secuencia de verificación de trama","Preámbulo","Tipo","CTS"], c:[1],
  why:"FCS (Frame Check Sequence) = CRC de 4 bytes al final de la trama. Que Ethernet sea no fiable significa que no retransmite, no que no detecte errores.",
  src:"Revisión en clase del 1er parcial" },
{ b:"u2", q:"Si el tamaño de una trama Ethernet es de 1458 bytes, determinar la carga útil (datos) en el paquete IPv4:",
  o:["1428 bytes","1440 bytes","1420 bytes","1400 bytes","1410 bytes"], c:[1],
  why:"1458 − 18 bytes de Ethernet (MAC destino 6 + MAC origen 6 + tipo 2 + FCS 4) = 1440. Lo que va en el campo de datos de la trama (el paquete IPv4) son 1440 bytes. El preámbulo no se cuenta.",
  nota:"Estrictamente, 1440 es el paquete IPv4 completo (con sus 20 bytes de cabecera); los datos puros serían 1420. En la revisión del profe la correcta fue 1440: restá solo los 18 bytes de Ethernet.",
  src:"Revisión en clase del 1er parcial" },
{ b:"u2", q:"Una PC tiene que enviar un archivo de 5 Kbytes a través de FastEthernet. Si desea maximizar el uso de la MTU, ello implica que enviará:",
  o:["5 tramas","2 tramas","4 tramas","3 tramas","1 trama"], c:[2],
  why:"La MTU de Ethernet es 1500 bytes. 5 KB = 5120 bytes → 5120 / 1500 = 3,4 → hacen falta 4 tramas (3 llenas + 1 parcial).",
  src:"Revisión en clase del 1er parcial" },
{ b:"u2", q:"¿Cuál es la máxima tasa de bits a la que funcionará una LAN Ethernet si el switch tiene 24 puertos de 1 Gb/s, dos puertos de fibra de 10 Gb/s, el cableado está certificado categoría 6 y las placas de red de las PC son Fast Ethernet?",
  o:["24 Gb/s","2,4 Gb/s","22,4 Gb/s","1 Gb/s","100 Mb/s"], c:[4],
  why:"La velocidad la limita el eslabón más lento: las NIC Fast Ethernet van a 100 Mb/s, y el puerto del switch autonegocia a esa velocidad.",

{ b:"u2", q:"Si una estación de trabajo se encuentra a 180 m del armario principal de la red:",
  o:["Podré empalmar dos cables UTP de largo normalizado (90 m)","Podré colocar un switch en un punto intermedio para repetir la señal","Deberé ubicar a la estación en otra VLAN","Reemplazaré el cable UTP por coaxil"], c:[1],
  why:"El UTP llega a 100 m (90 m de cableado horizontal). Para 180 m hay que regenerar la señal en el medio con un dispositivo activo (switch). Empalmar cables no regenera nada.",

{ b:"u2", q:"Se deben conectar tres edificios de un campus. A está a 300 m de B, C a 250 m de A y C a 350 m de B. ¿Qué tecnología se podría implementar?",

{ b:"u2", q:"¿En qué capa del modelo OSI trabaja un switch?",

{ b:"u2", q:"Se dice que un Access Point es un tipo de [ ___ ] porque interconecta redes cableadas que funcionan con el protocolo [ ___ ] con dispositivos inalámbricos que ejecutan [ ___ ]. Elegí las tres que completan:",

{ b:"u2", q:"¿Qué dispositivo divide dominios de colisión?",

{ b:"u2", q:"Un switch de 24 bocas está conectado a un hub (puerto 1), a otro hub (puerto 2), a un router (puerto 3) y a computadoras en el resto de los puertos. ¿Cuántos dominios de colisión existen?",

{ b:"u2", q:"Si en una LAN se tienen 3 switches (en la figura del parcial sumaban 82 puertos entre los tres) interconectados entre sí, ¿hasta cuántos dominios de BROADCAST podría haber (sin VLANs)?",

{ b:"u2", q:"A partir de la topología y la tabla MAC del switch, ¿por cuáles puertos se transmitirá la trama si la máquina E le envía datos a la máquina B?",

{ b:"u2", q:"Un host conectado a la interfaz Fa0/5 de un switch envía una trama con MAC origen 24:f5:aa:70:7e:1f. ¿Qué dirección agregará el switch en su tabla CAM para el puerto 0/5?",

{ b:"u2", q:"¿Qué información se almacena en la tabla CAM?",

{ b:"u2", q:"Respecto de las técnicas de reenvío de tramas de los switch, uní:",

  src:"Moodle 1er Parcial 4K4 (2020)" },
{ b:"u3", q:"Un administrador va a configurar VLAN dinámicas para la empresa a través de un servidor. ¿Cómo se denomina ese servidor?",
  o:["DHCP","VTP","VMPS","DNS"], c:[2],
  why:"VMPS (VLAN Management Policy Server) asigna la VLAN según la MAC del equipo conectado.",
  src:"Preguntero 1er parcial (zip)" },
{ b:"u3", q:"Una empresa tiene un switch con 20 PC. El administrador saca el cable del puerto 4 y lo pone en el 18. El empleado se queja de que no tiene conectividad. ¿Cuál podría ser la causa?",
  o:["El puerto 18 está en modo troncal","El switch usa STP","El cable está cruzado","El switch tiene implementado VLANs basadas en el puerto"], c:[3],
  why:"Con VLAN estática por puerto, el puerto 18 pertenece a otra VLAN que el 4: la PC quedó en otra red lógica.",
  src:"Preguntero 1er parcial (zip)" },
{ b:"u3", q:"La dirección 01:00:5E:00:04:C9 aparece en el campo destino de una trama. ¿Cuál afirmación es correcta?",
  o:["La trama será procesada sólo por un grupo de máquinas de la LAN","Nunca puede aparecer esa dirección en el destino","La trama será procesada sólo por una PC","Es una dirección jerárquica","Todas las PC de la LAN procesarán la trama"], c:[0],
  why:"01:00:5E es el prefijo de MAC multicast IPv4 (el bit menos significativo del primer byte en 1 = grupo). La procesan solo las NIC suscriptas a ese grupo.",
  src:"Revisión en clase del 1er parcial / FORMS Direcciones IP y Trama" },
{ b:"u3", q:"Si se requiere que una trama sea procesada por todos los dispositivos de una determinada LAN, la dirección de destino será:",
  o:["FF-FF-FF-FF-FF-FF","127.0.0.1","01-00-5E-98-76-54","255.255.255.255"], c:[0],
  why:"Se pregunta por la TRAMA (capa 2): broadcast MAC FF-FF-FF-FF-FF-FF. 255.255.255.255 es broadcast IP (capa 3), trampa típica.",
  src:"Revisión en clase del 1er parcial" },
{ b:"u3", q:"Un router recibe por una de sus interfaces un paquete cuya dirección destino es 255.255.255.255. ¿Qué hace?",
  o:["Lo reenvía por todas sus interfaces","Lo reenvía por la ruta por defecto","Lo procesa y NO lo reenvía a otras redes","Lo devuelve al origen"], c:[2],
  why:"255.255.255.255 es broadcast limitado: solo vale en la red local. El router lo procesa si le corresponde pero nunca lo reenvía (los routers dividen dominios de broadcast).",
  nota:"Reconstruida: en el FORMS 'Direcciones IP y Trama' solo figura la letra (e) de la respuesta, sin las opciones.",
  src:"FORMS Direcciones IP y Trama (reconstruida)" },

// ======================= 4. EXTRA (2020): IPv6, ARP, DHCP, ICMP =======================
{ b:"x", q:"¿Cuál de los siguientes describe el prefijo de subred de una dirección IPv6 (unicast global típica)?",
  o:["/48","/64","/16","/32","/128"], c:[1],
  why:"En IPv6 la subred suele ser /64: 64 bits de prefijo (global + subred) y 64 de identificador de interfaz.",
  src:"Revisión en clase del 1er parcial (2020)" },
{ b:"x", q:"Sea la dirección IPv6 2001:00ab:f000:0cde:0000:0000:1234:0000. Indique la escritura comprimida correcta:",
  o:["2001:ab:f:cde::1234:0","2001:ab::cde::1234","2001:0ab:f:0cde::1234:0","2001:ab:f000:cde::1234:0","2001:ab:f000:cde::1234"], c:[3],
  why:"Se sacan solo los ceros a la IZQUIERDA de cada grupo (f000 queda igual) y '::' se usa una sola vez para el grupo de ceros consecutivos. El último 0000 queda como :0.",
  src:"Moodle 1er Parcial 4K4 (2020)" },
{ b:"x", q:"Indique cuáles de los siguientes son tipos de direcciones IPv6 según la RFC 4291:",
  o:["Anycast","Dual stack","De enlace local","APIPA","Unicast","Loopback","Multicast","Broadcast"], c:[0,2,4,5,6],
  why:"IPv6 tiene unicast (global, enlace local, loopback ::1...), multicast y anycast. NO existe broadcast en IPv6.",
  src:"Moodle 1er Parcial 4K4 (2020)" },
{ b:"x", q:"La cabecera del protocolo IPv6:",
  o:["Contiene más campos que IPv4","Posee menos bytes que la cabecera de IPv4","Tiene un tamaño máximo","Permite un procesamiento más rápido en los routers que IPv4","Permite la fragmentación de paquetes en los routers"], c:[3],
  why:"La cabecera IPv6 es fija (40 bytes, más grande que los 20 de IPv4) y simplificada (sin checksum ni fragmentación en routers): se procesa más rápido.",
  src:"Revisión en clase del 1er parcial (2020)" },
{ b:"x", q:"Qué tipo de dirección IPv6 permite conectividad en Internet:",
  o:["Broadcast","Multicast","Global","Documentación","Link local"], c:[2],
  why:"La unicast global (2000::/3) es la enrutable en Internet. Link local (fe80) nunca se enruta.",
  src:"Revisión en clase del 1er parcial (2020)" },
{ b:"x", q:"Cuál de los siguientes protocolos permite que una PC obtenga una dirección IPv4 a partir de su MAC, con tablas estáticas en el servidor y requiriendo que la PC esté en la misma LAN que el servidor:",
  o:["DHCPv6","Internet Protocol","Bootstrap Protocol","Reverse Address Resolution Protocol","Address Resolution Protocol"], c:[3],
  why:"RARP: MAC → IP, con tablas estáticas y por broadcast (no pasa routers, misma LAN). BOOTP también usa tablas estáticas pero puede pasar routers con agente relay. ARP hace al revés (IP → MAC).",
  nota:"En la captura alguien marcó ARP, pero ARP resuelve IP → MAC. La descripción corresponde a RARP.",
  src:"Revisión en clase del 1er parcial (2020)" },
{ b:"x", q:"Un mensaje ARP-reply se encapsula en:",
  o:["Un paquete con dirección destino 255.255.255.255","Un paquete con dirección destino unicast","Una trama con dirección destino unicast","Una trama con dirección destino multicast","Una trama con dirección destino FF:FF:FF:FF:FF:FF"], c:[2],
  why:"ARP va directo sobre la trama (no en un paquete IP). El request es broadcast; el REPLY es unicast al que preguntó.",
  src:"Revisión en clase del 1er parcial (2020)" },
{ b:"x", q:"Las tablas ARP:",
  o:["Tienen sólo entradas dinámicas","Poseen sólo entradas estáticas","Pueden tener entradas dinámicas y estáticas","Necesitan configuración de las entradas dinámicas"], c:[2],
  why:"La caché ARP aprende entradas dinámicas (con vencimiento) y el admin puede cargar estáticas (arp -s).",
  src:"Revisión en clase del 1er parcial (2020)" },
{ b:"x", q:"La dirección MAC destino en una trama enviada desde una PC que está arrancando hacia un servidor DHCP es:",
  o:["FF-FF-FF-FF-FF-FF","0.0.0.0","1111-1111-1111-1111","Dirección IP del servidor DHCP","255.255.255.255"], c:[0],
  why:"El DHCP Discover va en broadcast: MAC destino FF-FF-FF-FF-FF-FF e IP destino 255.255.255.255 (IP origen 0.0.0.0). Pregunta por la MAC → FF-FF...",
  src:"Revisión en clase del 1er parcial (2020)" },
{ b:"x", q:"La dirección IP destino en un paquete enviado desde una PC que está arrancando hacia un servidor DHCP es:",
  o:["Dirección IP del servidor DHCP","255.255.255.255","FF-FF-FF-FF-FF-FF","1111-1111-1111-1111","0.0.0.0"], c:[1],
  why:"IP destino del Discover = 255.255.255.255 (broadcast limitado); la PC todavía no conoce al servidor. 0.0.0.0 es la IP ORIGEN.",
  src:"Revisión en clase del 1er parcial (2020)" },
{ b:"x", q:"El agente relay DHCP se ejecuta cuando:",
  o:["Cliente y servidor Web se encuentran en diferentes subredes","Cliente y servidor DHCP están en la misma subred","Existe un servidor DHCP en cada subred","Cliente y servidor DHCP se encuentran en diferentes subredes"], c:[3],
  why:"El broadcast del Discover no atraviesa routers; el relay (ip helper-address en el router) lo reenvía en unicast al servidor DHCP de otra subred.",
  nota:"En la captura alguien marcó 'misma subred', que es justamente cuando NO hace falta relay.",
  src:"Revisión en clase del 1er parcial (2020)" },
{ b:"x", q:"Los campos de la cabecera de ICMP son:",
  o:["Versión, TTL, tipo y código","Tipo, TTL y suma de verificación","Tipo, código, TTL, versión y suma de verificación","Tipo, código y suma de verificación"], c:[3],
  why:"Cabecera ICMP: Tipo (8 bits), Código (8 bits) y Checksum (16 bits). TTL y versión son de IP.",
  src:"Revisión en clase del 1er parcial (2020)" },
{ b:"x", q:"Qué significa un ping exitoso a la dirección IPv6 ::1:",
  o:["La dirección de enlace local está bien configurada","El switch funciona correctamente","Los protocolos TCP/IP están instalados correctamente","El gateway está configurado correctamente","La placa de red funciona correctamente"], c:[2],
  why:"::1 es loopback (como 127.0.0.1): el paquete no sale del equipo, solo prueba la pila TCP/IP.",
  src:"Revisión en clase del 1er parcial (2020)" },
{ b:"x", q:"Captura Wireshark: el TTL de la respuesta llegó en 53 y el host destino respondió con TTL inicial 65, decrementado en cada router. Se ejecutó un comando que muestra los saltos. ¿Cuáles son correctas? (seleccione 3)",
  o:["El host destino estaba a 12 saltos del origen","El host destino estaba a 53 saltos","El comando ejecutado fue tracert","El protocolo es de capa de transporte","El protocolo es de capa de interred"], c:[0,2,4],
  why:"65 − 53 = 12 saltos. tracert usa ICMP (capa de interred) con TTL incrementales para descubrir cada router.",
  src:"Moodle 1er Parcial 4K4 (2020)" },

{ b:"u1", q:"Red donde todos los dispositivos comparten un canal de comunicación y es necesario un esquema de direcciones para distinguir uno de otro:",

{ b:"u1", q:"Organización voluntaria que emite estándares en el ámbito científico, tecnológico, industrial y de sistemas de información:",

{ b:"u1", q:"Los estándares Ethernet, Fast Ethernet, Gigabit Ethernet y WiFi fueron definidos por:",

{ b:"u1", q:"¿Cuál de los organismos desarrolla trabajos de investigación a largo plazo relacionados con los protocolos de Internet?",

{ b:"u1", q:"Ventajas de la conmutación de paquetes frente a la conmutación de circuitos (seleccione 2):",

{ b:"u1", q:"Un usuario residencial normalmente se conecta a Internet a través de:",

{ b:"u2", q:"Servicios del Sistema de Distribución IEEE 802.11 (seleccione 2):",

{ b:"u2", q:"Tecnología inalámbrica: ¿cómo se llama el problema en que los nodos, por tener alcance limitado, no se perciben entre sí por estar en distintas áreas de alcance?",
  o:["Problema de terminal oculta","Problema de autenticación","Problema de terminal expuesta","Problema de integridad","Problema de AP expuesto"], c:[0],
  why:"Terminal oculta: no detecta al competidor porque está lejos y chocan en el receptor. Expuesta: se calla sin necesidad.",

{ b:"u2", q:"Frecuencias que utiliza la tecnología inalámbrica IEEE 802.11 (seleccione 2):",

{ b:"u2", q:"Si se desea brindar Internet de forma inalámbrica en entornos rurales, ¿qué tecnología se podría implementar?",

{ b:"u2", q:"Para garantizar que un switch conmute las tramas lo más rápido posible, ¿qué técnica debe configurar?",

{ b:"u2", q:"La NIC verifica el FCS mediante el cálculo del CRC y detecta que no coincide con el valor de la trama. ¿Qué hace?",

  why:"Ethernet es de máximo esfuerzo: la trama con error se descarta en silencio. Si hace falta, retransmite una capa superior (TCP).",

{ b:"u2", q:"¿Qué dispositivos extienden el dominio de broadcast? (seleccione 3)",

{ b:"u2", q:"Método de acceso al medio adecuado para una red cableada con medio compartido (bus o hub) y para una inalámbrica, respectivamente:",
  o:["CSMA/CD y CSMA/CA","CSMA/CA y CSMA/CD","Token Ring en ambas","CSMA/CD en ambas"], c:[0],
  why:"En cable se pueden detectar colisiones (CD); en radio no, así que se previenen (CA).",

{ b:"u2", q:"Se actualiza la placa de red de una PC de Fast Ethernet a Gigabit Ethernet. ¿Qué cambia? (seleccione 2)",

  why:"Pasa de 100 a 1000 Mbps (10 veces más). Es otra NIC, así que tiene otra MAC grabada en ROM. La IP es lógica y no cambia.",

{ b:"u3", q:"Una máscara de red/subred está formada por:",

{ b:"u3", q:"¿127.5.5.5 es una dirección de loopback (localhost)?",

{ b:"u3", q:"¿Qué es el gateway por defecto de una PC?",

{ b:"u3", q:"Afirmaciones correctas sobre las direcciones IPv4 privadas:",

  why:"Privadas RFC 1918: 1 red A (10.0.0.0), 16 redes B (172.16 a 172.31) y 256 redes C (192.168.0 a 192.168.255).",

{ b:"u3", q:"¿Cuántas direcciones IP válidas tiene 150.150.192.0/22?",
  o:["1022","1024","510","254","2046"], c:[0],

  src:"Preguntas 4K1" },
{ b:"u3", q:"¿Cuál es la dirección de broadcast de la subred 105.5.44.0/23?",

{ b:"u3", q:"El prefijo /18 equivale a la máscara:",
  o:["255.255.192.0","255.255.224.0","255.255.128.0","255.192.0.0"], c:[0],

{ b:"u3", q:"Con la red 185.6.0.0/25, ¿cuántas direcciones se pierden en total por las direcciones de subred y broadcast?",

  src:"Preguntas 4K1" },
{ b:"u3", q:"El AND booleano entre la dirección IPv4 de una PC y su máscara da como resultado:",

// ---------- utilidades ----------
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hash = s => { let h = 5381; for (const ch of s) h = ((h << 5) + h + ch.charCodeAt(0)) | 0; return (h >>> 0).toString(36); };
PREGUNTAS.forEach((p, i) => { p.id = hash(p.b + "|" + p.q + "|" + p.o.join("|")); p.i = i; });
SIMULADAS.forEach((p, i) => { p.id = "s" + hash(p.q + "|" + p.o.join("|")); p.i = i; p.sim = true; });
const bloque = id => BLOQUES.find(b => b.id === id) || BLOQUES_SIM.find(b => b.id === id);
// Dos bancos: "inicio" = FORMS; "simuladas" = Simulacro dirigido (facu-estudio)
const BANCOS = {
  inicio: { ps: PREGUNTAS, bl: BLOQUES, kT: "tema", kS: "seed", corto: { u1: "Arquitectura/Internet", u2: "Acceso/Dispositivos/WLAN", u3: "IPv4/Subredes/VLAN", x: "Extra IPv6/ARP/DHCP" } },
  simuladas: { ps: SIMULADAS, bl: BLOQUES_SIM, kT: "temaS", kS: "seedS" }
};
let VISTA = "inicio";
const banco = () => BANCOS[VISTA];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// ---------- persistencia ----------
const LS = "simulador-p1-redes";
let DB = { st: {}, mezclarOpc: true, mezclarPreg: true };
try { DB = Object.assign(DB, JSON.parse(localStorage.getItem(LS) || "{}")); } catch (e) {}
const guardar = () => { try { localStorage.setItem(LS, JSON.stringify(DB)); } catch (e) {} };
function registrar(p, ok) {
  const s = DB.st[p.id] || { a: 0, ok: 0, last: null };
  s.a++; if (ok) s.ok++; s.last = ok; DB.st[p.id] = s; guardar();
}
const falladas = () => banco().ps.filter(p => DB.st[p.id] && DB.st[p.id].last === false);

// ---------- navegación ----------
let Q = null; // estado del cuestionario en curso
function ir(v, arg) {
  if (v === "inicio" || v === "simuladas") VISTA = v;
  const enSim = Q && Q.banco === "simuladas" && (v === "quiz" || v === "res");
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.v === v
    || (enSim && b.dataset.v === "simuladas") || (!enSim && v === "quiz" && Q && Q.modo === "sim" && b.dataset.v === "simulacro")));
  window.scrollTo(0, 0);
  ({ inicio: vInicio, simuladas: vInicio, simulacro: vSimulacro, repaso: vRepaso, stats: vStats, quiz: vQuiz, res: vRes })[v](arg);
}
document.querySelectorAll("#nav button").forEach(b => b.onclick = () => ir(b.dataset.v));

// ---------- bloques aleatorios (estables por semilla) ----------
const N_BLOQUES = 4;
if (!DB.seed) { DB.seed = Math.floor(Math.random() * 1e9) + 1; }
if (!DB.seedS) { DB.seedS = Math.floor(Math.random() * 1e9) + 1; }
DB.tema = DB.tema || "todos"; DB.temaS = DB.temaS || "todos"; DB.estado = DB.estado || "todas";
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function bloquesAleatorios() {
  const r = rng(DB[banco().kS]);
  const a = banco().ps.slice().sort((x, y) => x.id < y.id ? -1 : 1);
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }

function simulacro(n, k) {
  // reparto proporcional por bloque
  const B = BANCOS[k || "inicio"], PS = B.ps;
  const sel = [];
  const tot = PS.length;
  B.bl.forEach(b => {
    const ps = shuffle(PS.filter(p => p.b === b.id));
    sel.push(...ps.slice(0, Math.max(1, Math.round(n * ps.length / tot))));
  });
  let fin = shuffle(sel).slice(0, n);
  if (fin.length < n) fin = fin.concat(shuffle(PS.filter(p => !fin.includes(p))).slice(0, n - fin.length));
  if (k === "simuladas") VISTA = "simuladas"; else VISTA = "inicio";
  empezar(fin, `${k === "simuladas" ? "Simulacro de simuladas" : "Simulacro"} · ${n} preguntas`, "sim", true);
}

const esGrid = p => Array.isArray(p.filas);

}
function ordenOpc(p) {

// ---------- ESTADÍSTICAS ----------
function tablaStats(PS, BL) {
  const filas = BL.map(b => {
    const ps = PS.filter(p => p.b === b.id);
    const a = ps.reduce((s, p) => s + (DB.st[p.id] ? DB.st[p.id].a : 0), 0);
    const ok = ps.reduce((s, p) => s + (DB.st[p.id] ? DB.st[p.id].ok : 0), 0);
    const vistas = ps.filter(p => DB.st[p.id]).length;
    return { t: etqB(b), n: ps.length, vistas, a, ok };
  });
  const T = filas.reduce((s, f) => ({ t: "Total", n: s.n + f.n, vistas: s.vistas + f.vistas, a: s.a + f.a, ok: s.ok + f.ok }), { n: 0, vistas: 0, a: 0, ok: 0 });
  const pc = f => f.a ? Math.round(100 * f.ok / f.a) + "%" : "–";
  return `<table class="st">
    <tr><th>Bloque</th><th>Preguntas</th><th>Vistas</th><th>Intentos</th><th>Aciertos</th></tr>
    ${filas.concat(T).map(f => `<tr><td>${esc(f.t)}</td><td>${f.n}</td><td>${f.vistas}</td><td>${f.a}</td><td>${pc(f)}</td></tr>`).join("")}
  </table>`;
}
function vStats() {
  app.innerHTML = `
  <h1 class="tit">Estadísticas</h1>
  <p class="lead">Se guardan en este navegador. “Aciertos” cuenta todos los intentos.</p>
  <h2 style="margin:18px 0 8px;color:var(--rojo-osc);font-size:19px">Preguntas del P1</h2>
  ${tablaStats(PREGUNTAS, BLOQUES)}
  <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">
    <button class="btn sec" id="rst">Borrar estadísticas</button>
  </div>`;
  const r = $("#rst");
  r.onclick = () => {
    if (r.dataset.c) { DB.st = {}; guardar(); vStats(); }
    else { r.dataset.c = 1; r.textContent = "¿Seguro? Tocá de nuevo para borrar"; }
  };
}

// ---------- teclado ----------
app.addEventListener("click", e => { const im = e.target.closest(".ctx img"); if (im) zoom(im.src); });
document.addEventListener("keydown", e => {
  if (!Q || !app.querySelector(".qcard") || e.target.tagName === "INPUT") return;
  const it = Q.items[Q.idx];
  if (/^[1-9]$/.test(e.key) && !esGrid(it.p)) { const oi = it.orden[+e.key - 1]; if (oi !== undefined) elegir(oi); }
  if (e.key === "Enter") { const g = $("#go"); if (g && !g.disabled) { e.preventDefault(); g.click(); } }
});

ir("inicio");
</script>
